name: Deploy Web

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-deploy-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  TARGET_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
  API_BASE_URL: ${{ vars.API_BASE_URL }}
  PRIVY_APP_ID: ${{ vars.PRIVY_APP_ID }}
  PRIVY_CLIENT_ID: ${{ vars.PRIVY_CLIENT_ID }}
  PRIVY_APP_URL_SCHEME: ${{ vars.PRIVY_APP_URL_SCHEME }}
  PRIVY_RELYING_PARTY: ${{ vars.PRIVY_RELYING_PARTY || 'https://rwa.dxd.ink' }}
  REOWN_PROJECT_ID: ${{ vars.REOWN_PROJECT_ID }}
  SENTRY_DSN: ${{ vars.SENTRY_DSN }}
  SENTRY_ENVIRONMENT: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') && (vars.SENTRY_ENVIRONMENT || 'production') || 'preview' }}
  SENTRY_TRACES_SAMPLE_RATE: ${{ vars.SENTRY_TRACES_SAMPLE_RATE || '0.10' }}
  SENTRY_PROFILES_SAMPLE_RATE: ${{ vars.SENTRY_PROFILES_SAMPLE_RATE || '0.10' }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    name: Deploy Flutter Web to Vercel
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'pull_request') &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for key in \
            API_BASE_URL \
            PRIVY_APP_ID \
            PRIVY_CLIENT_ID \
            PRIVY_APP_URL_SCHEME \
            REOWN_PROJECT_ID \
            VERCEL_ORG_ID \
            VERCEL_PROJECT_ID \
            VERCEL_TOKEN; do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing required GitHub Actions configuration: $key" >&2
              exit 1
            fi
          done

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          flutter pub get

      - name: Build Privy web bridge
        run: npm run privy:web:build

      - name: Build Flutter Web
        shell: bash
        run: >-
          flutter build web --release
          --dart-define=API_BASE_URL="$API_BASE_URL"
          --dart-define=PRIVY_APP_ID="$PRIVY_APP_ID"
          --dart-define=PRIVY_CLIENT_ID="$PRIVY_CLIENT_ID"
          --dart-define=PRIVY_APP_URL_SCHEME="$PRIVY_APP_URL_SCHEME"
          --dart-define=PRIVY_RELYING_PARTY="$PRIVY_RELYING_PARTY"
          --dart-define=REOWN_PROJECT_ID="$REOWN_PROJECT_ID"
          ${SENTRY_DSN:+--dart-define=SENTRY_DSN=$SENTRY_DSN}
          --dart-define=SENTRY_ENVIRONMENT="$SENTRY_ENVIRONMENT"
          --dart-define=SENTRY_TRACES_SAMPLE_RATE="$SENTRY_TRACES_SAMPLE_RATE"
          --dart-define=SENTRY_PROFILES_SAMPLE_RATE="$SENTRY_PROFILES_SAMPLE_RATE"
          --dart-define=SENTRY_RELEASE="rwa_interface@${{ github.sha }}"

      - name: Prepare Vercel prebuilt output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel/output/static
          cp -a build/web/. .vercel/output/static/
          printf '%s\n' \
            '{' \
            '  "version": 3,' \
            '  "routes": [' \
            '    { "handle": "filesystem" },' \
            '    { "src": "/(.*)", "dest": "/index.html" }' \
            '  ]' \
            '}' > .vercel/output/config.json

      - name: Deploy preview
        if: env.TARGET_BRANCH != 'main'
        run: npx --yes vercel@latest deploy --prebuilt --yes --token="$VERCEL_TOKEN"

      - name: Deploy production
        if: env.TARGET_BRANCH == 'main' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push')
        run: npx --yes vercel@latest deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
