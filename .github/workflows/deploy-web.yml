name: Deploy Web

on:
  push:
    paths:
      - 'private-key-export/**'
      - 'tool/privy-auth/**'
      - 'scripts/generate-passkey-association-files*'
      - 'scripts/sync-privy-url-scheme*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-web.yml'
  pull_request:
    paths:
      - 'private-key-export/**'
      - 'tool/privy-auth/**'
      - 'scripts/generate-passkey-association-files*'
      - 'scripts/sync-privy-url-scheme*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  PRIVY_APP_ID: ${{ vars.PRIVY_APP_ID }}
  PRIVY_EXPORT_URL: ${{ vars.PRIVY_EXPORT_URL }}
  APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
  IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'global.nobell.app' }}
  ANDROID_PACKAGE_NAME: ${{ vars.ANDROID_PACKAGE_NAME || 'global.nobell.app' }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    name: Deploy private-key export page to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Java for Android certificate inspection
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for key in \
            PRIVY_APP_ID \
            PRIVY_EXPORT_URL \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD \
            VERCEL_ORG_ID \
            VERCEL_PROJECT_ID \
            VERCEL_TOKEN; do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing required GitHub Actions configuration: $key" >&2
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test Passkey configuration tooling
        run: node --test scripts/generate-passkey-association-files.test.mjs scripts/sync-privy-url-scheme.test.mjs

      - name: Build private-key export page
        run: npm run privy:export:build

      - name: Prepare Vercel prebuilt output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel/output/static
          cp -a private-key-export/dist/. .vercel/output/static/
          cp private-key-export/vercel-output-config.json .vercel/output/config.json

      - name: Deploy preview
        if: github.ref != 'refs/heads/main'
        run: npx --yes vercel@latest deploy --prebuilt --yes --token="$VERCEL_TOKEN"

      - name: Deploy production
        if: github.ref == 'refs/heads/main'
        run: npx --yes vercel@latest deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
