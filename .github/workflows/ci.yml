name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-bundle-tools:
    name: Android Bundle Tools
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK and bundle verification tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;36.0.0'
      - name: Verify Android tools and test bundle verification
        run: |
          set -euo pipefail
          sdkmanager --version
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          test -x "$ANDROID_HOME/build-tools/36.0.0/zipalign"
          python3 -m unittest discover -s scripts -p 'verify_android_bundle_test.py'
      - name: Setup Flutter for native regression tests
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
      - name: Resolve Flutter plugins
        run: flutter pub get
      - name: Prepare Android Gradle test project
        # The Gradle wrapper and local.properties are generated and gitignored.
        # Prepare them through Flutter before invoking Gradle on a clean checkout.
        run: flutter build apk --debug --config-only --no-pub --target-platform android-arm64
      - name: Test Android authentication context lifecycle
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest -Ptarget-platform=android-arm64 --console=plain

  ios-signing-tools:
    name: iOS Signing Tools
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup OpenSSL for certificate compatibility
        shell: bash
        run: |
          set -euo pipefail
          if ! brew list --versions openssl@3 >/dev/null 2>&1; then
            brew install openssl@3
          fi
          openssl_bin="$(brew --prefix openssl@3)/bin"
          echo "$openssl_bin" >> "$GITHUB_PATH"
          "$openssl_bin/openssl" version
      - name: Test PKCS12 compatibility with macOS Keychain
        run: python3 -m unittest discover -s scripts -p 'ios_release_test.py'
      - name: Setup Flutter for iOS release archive
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
      - name: Setup Node for native configuration
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare unsigned iOS build
        run: |
          flutter pub get
          make sync-privy-config ENV_FILE=.env.example
      - name: Build unsigned iOS release archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          flutter build ipa --release --no-codesign --obfuscate \
            --split-debug-info=build/symbols/ios \
            --dart-define-from-file=.env.example \
            --verbose > build/ios-release-build.log 2>&1 || {
              tail -n 120 build/ios-release-build.log
              exit 1
            }
      - name: Verify Rive exports in archived Runner
        shell: bash
        run: |
          set -euo pipefail
          app=build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app
          xcrun dyld_info -exports "$app/Runner" > build/ios/rive-archive-exports.txt
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          import sys
          sys.path.insert(0, 'scripts')
          import ios_release
          app = Path('build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app')
          ios_release.verify_rive_symbols(app, plistlib.loads((app / 'Info.plist').read_bytes()))
          print('Verified Rive FFI exports in the actual Release archive.')
          PY
      - name: Upload iOS archive diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-archive-diagnostics
          path: |
            build/ios-release-build.log
            build/ios/rive-archive-exports.txt
          if-no-files-found: ignore
          retention-days: 7

  quality:
    name: Contract and Flutter Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Test iOS release configuration
        run: python3 -m unittest discover -s scripts -p 'ios_release_test.py'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Validate Flutter environment template
        run: make env-check ENV_FILE=.env.example
      - name: Run Flutter quality gate
        run: >-
          dart format --output=none --set-exit-if-changed lib test
          && dart analyze --fatal-infos
          && flutter test
      - name: Validate App Review mode
        run: flutter test --dart-define=APP_REVIEW_ENABLED=true test/app_review
