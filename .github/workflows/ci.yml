name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-bundle-tools:
    name: Android Bundle Tools
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK and bundle verification tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;36.0.0'
      - name: Verify Android tools and test bundle verification
        run: |
          set -euo pipefail
          sdkmanager --version
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          test -x "$ANDROID_HOME/build-tools/36.0.0/zipalign"
          python3 -m unittest discover -s scripts -p 'verify_android_bundle_test.py'
      - name: Setup Flutter for native regression tests
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
      - name: Resolve Flutter plugins
        run: flutter pub get
      - name: Prepare Android Gradle test project
        # The Gradle wrapper and local.properties are generated and gitignored.
        # Prepare them through Flutter before invoking Gradle on a clean checkout.
        run: flutter build apk --debug --config-only --no-pub --target-platform android-arm64
      - name: Test Android authentication context lifecycle
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest -Ptarget-platform=android-arm64 --console=plain

  ios-signing-tools:
    name: iOS Signing Tools
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup OpenSSL for certificate compatibility
        shell: bash
        run: |
          set -euo pipefail
          if ! brew list --versions openssl@3 >/dev/null 2>&1; then
            brew install openssl@3
          fi
          openssl_bin="$(brew --prefix openssl@3)/bin"
          echo "$openssl_bin" >> "$GITHUB_PATH"
          "$openssl_bin/openssl" version
      - name: Test PKCS12 compatibility with macOS Keychain
        run: python3 -m unittest discover -s scripts -p 'ios_release_test.py'

  quality:
    name: Contract and Flutter Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Test iOS release configuration
        run: python3 -m unittest discover -s scripts -p 'ios_release_test.py'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Validate Flutter environment template
        run: make env-check ENV_FILE=.env.example
      - name: Run Flutter quality gate
        run: >-
          dart format --output=none --set-exit-if-changed lib test
          && dart analyze --fatal-infos
          && flutter test
      - name: Validate App Review mode
        run: flutter test --dart-define=APP_REVIEW_ENABLED=true test/app_review
