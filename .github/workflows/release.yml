name: Release Mobile

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  TARGET_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
  API_BASE_URL: ${{ vars.API_BASE_URL }}
  PRIVY_APP_ID: ${{ vars.PRIVY_APP_ID }}
  PRIVY_CLIENT_ID: ${{ vars.PRIVY_CLIENT_ID }}
  PRIVY_APP_URL_SCHEME: ${{ vars.PRIVY_APP_URL_SCHEME }}
  REOWN_PROJECT_ID: ${{ vars.REOWN_PROJECT_ID }}
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
  SENTRY_ORG: ${{ vars.SENTRY_ORG || 'dodo-k4' }}
  SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || 'rwa' }}
  SENTRY_DSN: ${{ vars.SENTRY_DSN }}
  SENTRY_ENVIRONMENT: ${{ vars.SENTRY_ENVIRONMENT || 'production' }}
  SENTRY_TRACES_SAMPLE_RATE: ${{ vars.SENTRY_TRACES_SAMPLE_RATE || '0.10' }}
  SENTRY_PROFILES_SAMPLE_RATE: ${{ vars.SENTRY_PROFILES_SAMPLE_RATE || '0.10' }}

jobs:
  detect-release:
    name: Detect Version Release
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.version.outputs.should_build }}
      should_release: ${{ steps.version.outputs.should_release }}
      tag: ${{ steps.version.outputs.tag }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_SHA }}

      - name: Validate version and decide release
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version_line="$(awk -F': ' '/^version: /{print $2}' pubspec.yaml | tr -d '[:space:]')"
          if [[ ! "$version_line" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-([0-9A-Za-z.-]+))?\+([1-9][0-9]*)$ ]]; then
            echo "pubspec.yaml version must use semantic version plus a positive build number, for example 1.0.0+1." >&2
            exit 1
          fi

          version_name="${version_line%%+*}"
          tag="v${version_name}"
          should_build="true"
          should_release="false"
          prerelease="false"
          if [[ ! "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            prerelease="true"
          fi
          if [[ "$prerelease" == "false" && "$TARGET_BRANCH" != "main" ]]; then
            echo "Formal releases are only allowed from the main branch; use a prerelease suffix on ${TARGET_BRANCH}." >&2
            exit 1
          fi

          git fetch --tags --force
          previous_tag="$(
            git tag --sort=-version:refname |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
              grep -Fxv "$tag" |
              head -n1 || true
          )"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            tagged_commit="$(git rev-list -n 1 "$tag")"
            if [[ "$tagged_commit" != "$TARGET_SHA" ]]; then
              echo "Version ${version_name} already belongs to ${tagged_commit}; increment pubspec.yaml before releasing." >&2
              exit 1
            fi
          elif [[ "${{ github.event_name }}" == "workflow_run" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            should_release="true"
          fi

          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            before_sha="$(git rev-parse "${TARGET_SHA}^")"
            if git cat-file -e "${before_sha}:pubspec.yaml" 2>/dev/null; then
              previous_version="$(git show "${before_sha}:pubspec.yaml" | awk -F': ' '/^version: /{print $2}' | tr -d '[:space:]')"
              previous_name="${previous_version%%+*}"
              workflow_changed="false"
              if ! git diff --quiet "$before_sha" "$TARGET_SHA" -- .github/workflows/release.yml; then
                workflow_changed="true"
              fi
              if [[ "$previous_name" == "$version_name" && "$workflow_changed" != "true" ]]; then
                should_build="false"
                should_release="false"
              fi
            fi
          fi

          {
            echo "version=${version_line}"
            echo "tag=${tag}"
            echo "previous_tag=${previous_tag}"
            echo "should_build=${should_build}"
            echo "should_release=${should_release}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"

  android-release:
    name: Android Release APK
    needs:
      - detect-release
    if: needs.detect-release.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_SHA }}
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Create Flutter environment file
        shell: bash
        run: |
          set -euo pipefail
          for key in API_BASE_URL PRIVY_APP_ID PRIVY_CLIENT_ID PRIVY_APP_URL_SCHEME REOWN_PROJECT_ID; do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing required GitHub Actions variable: $key" >&2
              exit 1
            fi
          done
          printf '%s\n' \
            "API_BASE_URL=$API_BASE_URL" \
            "PRIVY_APP_ID=$PRIVY_APP_ID" \
            "PRIVY_CLIENT_ID=$PRIVY_CLIENT_ID" \
            "PRIVY_APP_URL_SCHEME=$PRIVY_APP_URL_SCHEME" \
            "REOWN_PROJECT_ID=$REOWN_PROJECT_ID" > .env.ci
          make sync-privy-config ENV_FILE=.env.ci
      - name: Build Android split APKs
        shell: bash
        run: >-
          flutter build apk --release --split-per-abi --obfuscate
          --target-platform android-arm64
          --target-platform android-x64
          --dart-define-from-file=.env.ci
          --split-debug-info=build/symbols/android
          ${SENTRY_DSN:+--dart-define=SENTRY_DSN=$SENTRY_DSN}
          --dart-define=SENTRY_ENVIRONMENT="$SENTRY_ENVIRONMENT"
          --dart-define=SENTRY_TRACES_SAMPLE_RATE="$SENTRY_TRACES_SAMPLE_RATE"
          --dart-define=SENTRY_PROFILES_SAMPLE_RATE="$SENTRY_PROFILES_SAMPLE_RATE"
          --dart-define=SENTRY_RELEASE="rwa_interface@${{ needs.detect-release.outputs.version }}"
      - name: Collect split APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release-assets
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/release-assets/rwa-interface-android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk build/release-assets/rwa-interface-android-x86_64.apk
      - name: Record Android artifact sizes
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Android artifact sizes"
            du -h build/release-assets/*.apk
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Android Dart symbols to Sentry
        if: env.SENTRY_AUTH_TOKEN != ''
        env:
          SENTRY_RELEASE: rwa_interface@${{ needs.detect-release.outputs.version }}
        run: dart run sentry_dart_plugin
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: rwa-interface-android
          path: |
            build/release-assets/*.apk
          if-no-files-found: error
          retention-days: 7

  ios-release:
    name: iOS Unsigned Release App
    needs:
      - detect-release
    if: needs.detect-release.outputs.should_build == 'true'
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_SHA }}
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Create Flutter environment file
        shell: bash
        run: |
          set -euo pipefail
          for key in API_BASE_URL PRIVY_APP_ID PRIVY_CLIENT_ID PRIVY_APP_URL_SCHEME REOWN_PROJECT_ID; do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing required GitHub Actions variable: $key" >&2
              exit 1
            fi
          done
          printf '%s\n' \
            "API_BASE_URL=$API_BASE_URL" \
            "PRIVY_APP_ID=$PRIVY_APP_ID" \
            "PRIVY_CLIENT_ID=$PRIVY_CLIENT_ID" \
            "PRIVY_APP_URL_SCHEME=$PRIVY_APP_URL_SCHEME" \
            "REOWN_PROJECT_ID=$REOWN_PROJECT_ID" > .env.ci
          make sync-privy-config ENV_FILE=.env.ci
      - name: Build unsigned iOS release app
        shell: bash
        run: >-
          flutter build ios --release --no-codesign --obfuscate
          --dart-define-from-file=.env.ci
          --split-debug-info=build/symbols/ios
          ${SENTRY_DSN:+--dart-define=SENTRY_DSN=$SENTRY_DSN}
          --dart-define=SENTRY_ENVIRONMENT="$SENTRY_ENVIRONMENT"
          --dart-define=SENTRY_TRACES_SAMPLE_RATE="$SENTRY_TRACES_SAMPLE_RATE"
          --dart-define=SENTRY_PROFILES_SAMPLE_RATE="$SENTRY_PROFILES_SAMPLE_RATE"
          --dart-define=SENTRY_RELEASE="rwa_interface@${{ needs.detect-release.outputs.version }}"
      - name: Upload iOS symbols to Sentry
        if: env.SENTRY_AUTH_TOKEN != ''
        env:
          SENTRY_RELEASE: rwa_interface@${{ needs.detect-release.outputs.version }}
        run: dart run sentry_dart_plugin
      - name: Package unsigned iOS app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/ios/rwa-interface-ios-unsigned.zip
      - name: Record iOS artifact size
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## iOS artifact size"
            du -h build/ios/rwa-interface-ios-unsigned.zip
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: rwa-interface-ios-unsigned
          path: |
            build/ios/rwa-interface-ios-unsigned.zip
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    needs:
      - detect-release
      - android-release
      - ios-release
    if: needs.detect-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_SHA }}
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rwa-interface-*
          path: release-assets
          merge-multiple: true
      - name: Build release notes from commits
        env:
          PREVIOUS_TAG: ${{ needs.detect-release.outputs.previous_tag }}
          TAG: ${{ needs.detect-release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          range="HEAD"
          if [[ -n "$PREVIOUS_TAG" ]]; then
            range="${PREVIOUS_TAG}..HEAD"
          fi
          {
            echo "## Changes"
            echo
            git log "$range" --no-merges --pretty='format:- %s (`%h`)' || true
          } > release-notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.detect-release.outputs.tag }}
          PRERELEASE: ${{ needs.detect-release.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          release_args=()
          if [[ "$PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$TAG" \
            release-assets/rwa-interface-android-arm64-v8a.apk \
            release-assets/rwa-interface-android-x86_64.apk \
            release-assets/rwa-interface-ios-unsigned.zip \
            --title "$TAG" \
            --notes-file release-notes.md \
            --target "${{ env.TARGET_SHA }}" \
            "${release_args[@]}"
