openapi: 3.0.3
info: {title: Generator Compatibility Fixture, version: 1.0.0}
paths:
  /things:
    get:
      operationId: listThings
      responses:
        '200':
          description: page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ThingPage'}
        '206':
          description: partial page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ThingPage'}
    delete:
      operationId: deleteThings
      responses:
        '204': {description: empty success}
  /events:
    get:
      operationId: streamFixtureEvents
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema: {type: string}
components:
  schemas:
    Decimal:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
    ThingPage:
      allOf:
        - {$ref: '#/components/schemas/Page'}
        - type: object
          required: [items]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/Event'}}
    Page:
      type: object
      required: [has_more]
      properties:
        has_more: {type: boolean}
        next_cursor: {type: string, nullable: true}
    Event:
      oneOf:
        - {$ref: '#/components/schemas/PriceEvent'}
        - {$ref: '#/components/schemas/UnknownEvent'}
      discriminator:
        propertyName: type
        mapping:
          price: '#/components/schemas/PriceEvent'
          unknown: '#/components/schemas/UnknownEvent'
    PriceEvent:
      type: object
      required: [type, price]
      properties:
        type: {type: string, enum: [price]}
        price: {$ref: '#/components/schemas/Decimal'}
    UnknownEvent:
      type: object
      required: [type]
      properties:
        type: {type: string, enum: [unknown]}
        optional_note: {type: string, nullable: true}
    ApiError:
      type: object
      required: [code]
      properties:
        code: {type: string}
