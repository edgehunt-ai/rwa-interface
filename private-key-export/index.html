<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Export private key</title>
  <style>
    html, body, #rwa-private-key-export-root { margin: 0; min-height: 100%; height: 100%; }
    body { background: #fff; color: #111215; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .export-state { box-sizing: border-box; min-height: 100%; padding: 48px 24px; display: grid; place-content: center; justify-items: center; text-align: center; }
    .export-state h1 { font-size: 20px; margin: 20px 0 8px; }
    .export-state p { color: #6f737b; margin: 0; }
    .spinner { width: 28px; height: 28px; border: 3px solid #e5e7eb; border-top-color: #111215; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="rwa-private-key-export-root"></div>
  <script>
    window.process = window.process || { env: {} };
    window.process.env = window.process.env || {};
    window.process.env.NODE_ENV = window.process.env.NODE_ENV || 'development';
  </script>
  <script type="module" src="/main.jsx"></script>
</body>
</html>
