        - source
        - selected_route
        - wallet_actions
        - expires_at
      properties:
        status:
          type: string
          enum: [blocked]
        blocker:
          $ref: "#/components/schemas/FundingPlanBlocker"
        source:
          type: object
          nullable: true
          enum: [null]
        selected_route:
          type: object
          nullable: true
          enum: [null]
        wallet_actions:
          type: array
          maxItems: 0
          items:
            $ref: "#/components/schemas/FundingWalletActionSummary"
        expires_at:
          type: string
          nullable: true
          enum: [null]
    TerminalFundingPlanState:
