openapi: 3.0.3
info:
  title: RWA Trading Platform API
  version: 1.0.0
  description: |
    RWA Trading Platform 的公共产品契约，是客户端和服务端共享的唯一 wire contract。
    它覆盖正式客户端所需的认证、市场、交易、资金、组合与实时事件能力；健康探针、
    管理写接口和 provider 私有字段不属于本契约。

    * **认证与交易钱包** — 登录由 Privy SDK 完成。客户端把 Privy access token
      直接作为 Bearer credential；本 API 不接收 body token，也不签发第二套 access token。
    * **行情** — 股票分组、榜单、K 线、美股参考价与交易时段。
    * **交易** — bStocks 现货与 HIP-3 永续的预览、订单、仓位和钱包动作。
    * **资金** — 钱包、资金准备、入金、划转、Claim 与提现。

    ## 两条产品线

    | | `bstock`（现货） | `perp`（合约） |
    |---|---|---|
    | 市场 | BSC bStocks Token | Hyperliquid HIP-3 Perpetual |
    | 资产结果 | BSC Wallet 内的链上证券代币 | HIP-3 合约仓位 |
    | 交易资金结算 | BSC USDT | Hyperliquid Perps USDC |
    | 保证金 | 无 | Isolated / Cross |

    ## 约定

    * 所有金额、价格、数量与费用均为十进制字符串。
    * 所有时间为 RFC 3339 UTC（例如 `2026-08-27T02:15:00Z`）。
    * 可增长的列表接口使用 cursor 分页。
    * 金融与交易命令要求 `Idempotency-Key`，冲突返回 `409 Error`。
    * 错误统一返回 `Error`，每个 JSON 响应携带 `X-Request-ID`。
    * 创建命令立即返回当前资源，不等待终态；后续状态通过资源 GET 与 SSE 获取，
      不提供通用 operation polling 资源。
  contact:
    name: RWA Platform API
  license:
    name: Proprietary
servers:
  - url: https://rwa-api-staging.dxd.ink
    description: Staging
  - url: http://localhost:8080
    description: Local
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Privy 登录、注册与会话
  - name: Account
    description: 账户资料与应用设置
  - name: Markets
    description: 股票、产品、榜单与行情统计
  - name: Charts
    description: K 线、参考价曲线与交易时段
  - name: Positions
    description: 现货持仓与合约仓位
  - name: Portfolio
    description: 总资产与持仓概览
  - name: Wallets
    description: Privy 钱包、同步与授权
  - name: Orders
    description: 订单预览、提交、查询、取消与钱包动作
  - name: Funding
    description: 入金、资金准备、划转、Claim 与提现
  - name: Activity
    description: 账户、资金与交易活动
  - name: System
    description: 版本、配置与静态文案
paths:
  /v1/auth/config:
    get:
      tags:
        - Auth
      summary: 获取客户端 Privy 配置
      description: |
        Flutter 端启动时拉取，用于初始化 Privy SDK。避免把 App ID / 支持的登录方式硬编码在客户端。
      operationId: getAuthConfig
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivyClientConfig"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/auth/session:
    post:
      tags:
        - Auth
      summary: 创建或恢复产品会话
      description: 客户端在 Privy SDK 登录后，把 Privy access token 直接放入 Authorization Bearer header。请求体仅包含可选语言和设备信息；响应不签发 access token。
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRequest"
      responses:
        "200":
          description: 登录成功；账户与资产已恢复
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "201":
          description: 注册成功；交易钱包已自动创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags:
        - Auth
      summary: 退出登录
      description: 结束当前产品会话，但不删除账户或资产。客户端同时调用 Privy SDK logout 清除 Privy 侧会话。
      operationId: deleteSession
      responses:
        "204":
          description: 已退出
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/me:
    get:
      tags:
        - Account
      summary: 当前登录账户
      description: 用户偏好作为 `settings` 子对象一并返回；更新走 `PATCH /v1/me/settings`。
      operationId: getMe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/me/settings:
    patch:
      tags:
        - Account
      summary: 更新当前用户的设置
      description: |
        部分更新：**所有字段都是可选的，传什么改什么，未传的字段保持不变**。

        **没有对应的 `GET`** —— 设置作为 `User.settings` 子对象随 `GET /v1/me` 一起返回，
        只存在一份定义，不会出现两个来源不一致的情况。
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSettingsUpdate"
      responses:
        "200":
          description: 返回更新后的完整设置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/me/devices:
    get:
      tags:
        - Account
      summary: 已注册的推送设备
      operationId: listDevices
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                title: DevicePage
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Device"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags:
        - Account
      summary: 注册 / 更新当前设备的推送令牌
      description: |
        按 `device_id` upsert。APNs / FCM 令牌会在重装、系统升级、长期未启动后轮换，
        因此客户端应在 **每次启动拿到令牌时** 都调一次，而不只在登录时提交一次。

        登录时 `SessionRequest.device` 里带的信息等价于调用一次本接口，
        两者可任选其一；令牌轮换只能靠本接口。
      operationId: registerDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRegisterRequest"
      responses:
        "200":
          description: 已注册 / 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/me/devices/{device_id}:
    delete:
      tags:
        - Account
      summary: 注销推送设备
      description: 退出登录时调用，避免继续向该设备推送已登出账户的消息。
      operationId: deleteDevice
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "204":
          description: 已注销
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/markets/stocks:
    get:
      tags:
        - Markets
      summary: 股票分组列表
      description: |
        市场页「股票」Tab。每支股票包含美股参考价与其支持的产品（bStocks / HIP-3），
        每个产品带自己的链上价格与相对参考价的价差。
      operationId: listStocks
      parameters:
        - name: q
          in: query
          description: 按代码或公司名模糊搜索
          schema:
            type: string
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                title: StockPage
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/StockGroup"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/markets/products:
    get:
      tags:
        - Markets
      summary: 产品列表 / 分组
      description: |
        首页和市场页的扁平产品列表统一数据源。用 `group` 区分「热门 / 涨幅 /
        跌幅 / 成交量 / 自选」；`favorites` 仅返回当前登录用户的自选产品。
        `product_type` 对应首页一级筛选（全部 / 现货 / 合约）。每项仍带
        `is_favorite`，用于渲染收藏状态。
      operationId: listProducts
      parameters:
        - name: group
          in: query
          description: 列表分组；`favorites` 为当前用户自选列表
          schema:
            $ref: "#/components/schemas/MarketProductGroup"
        - name: product_type
          in: query
          schema:
            $ref: "#/components/schemas/ProductType"
        - name: q
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                title: ProductPage
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required:
                      - items
                    properties:
                      caption:
                        type: string
                        description: 分组标题，如 `Losers · 24h 跌幅榜` 或 `Favorites · 自选`
                        example: Hot · 热门产品
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ProductListing"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/markets/{symbol}/products/{kind}:
    get:
      tags:
        - Markets
      summary: 产品详情
      description: 详情页顶部报价、产品说明、资产权益与行情统计的聚合接口。
      operationId: getProduct
      parameters:
        - $ref: "#/components/parameters/Symbol"
        - $ref: "#/components/parameters/ProductKind"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/markets/{symbol}/products/{kind}/stats:
    get:
      tags:
        - Markets
      summary: 24h 行情统计
      description: |
        24h 高 / 低、成交额、成交量、参考价与相对偏离（bStocks 为 Premium，HIP-3 为 Basis）、
        价差、买一卖一；HIP-3 额外返回资金费率与未平仓合约量。
      operationId: getProductStats
      parameters:
        - $ref: "#/components/parameters/Symbol"
        - $ref: "#/components/parameters/ProductKind"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketStats"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/markets/{symbol}/products/{kind}/orderbook:
    get:
      tags:
        - Markets
      summary: 订单簿深度
      operationId: getOrderBook
      parameters:
        - $ref: "#/components/parameters/Symbol"
        - $ref: "#/components/parameters/ProductKind"
        - name: depth
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderBook"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/markets/{symbol}/asset-info:
    get:
      tags:
        - Markets
      summary: 资产详情与权益
      description: |
        「资产详情与权益」弹窗的内容。bStocks 说明发行方、1:1 股票支持、公司行动、
        股息再投资、投票权；HIP-3 说明合约形态、无股东权益、保证金模式、资金费率方向。
      operationId: getAssetInfo
      parameters:
        - $ref: "#/components/parameters/Symbol"
        - name: kind
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/ProductKind"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetInfo"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/markets/favorites:
    put:
      tags:
        - Markets
      summary: 覆盖自选列表（用于排序）
      description: |
        仅用于将当前用户已有自选产品整体重新排序。读取自选列表统一使用
        `GET /v1/markets/products?group=favorites`。
      operationId: replaceFavorites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - items
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/ProductRef"
      responses:
        "204":
          description: 已更新
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/markets/{symbol}/products/{kind}/favorite:
    put:
      tags:
        - Markets
      summary: 加入自选
      description: 幂等操作。路径放在产品资源下，避免与产品详情路由产生模板歧义。
      operationId: addFavorite
      parameters:
        - $ref: "#/components/parameters/Symbol"
        - $ref: "#/components/parameters/ProductKind"
      responses:
        "204":
          description: 已加入
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags:
        - Markets
      summary: 取消自选
      description: 幂等操作。
      operationId: removeFavorite
      parameters:
        - $ref: "#/components/parameters/Symbol"
        - $ref: "#/components/parameters/ProductKind"
      responses:
        "204":
          description: 已取消
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/markets/{symbol}/products/{kind}/candles:
    get:
      tags:
        - Charts
      summary: K 线 / 价格序列
      description: |
        详情页图表数据。同时返回链上产品价格序列与美股参考价序列 —— 参考价仅在
        美股有报价的时段（盘前 / 开盘 / 盘后）存在，其余时段为空洞，前端据此画虚线。
      operationId: getCandles
      parameters:
        - $ref: "#/components/parameters/Symbol"
        - $ref: "#/components/parameters/ProductKind"
        - name: range
          in: query
          description: 预设区间；与 `from` / `to` 二选一
          schema:
            $ref: "#/components/schemas/ChartRange"
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: interval
          in: query
          description: 采样粒度，缺省由 `range` 推导
          schema:
            type: string
            enum:
              - 1m
              - 5m
              - 15m
              - 1h
              - 4h
              - 1d
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandleSeries"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/markets/sessions:
    get:
      tags:
        - Charts
      summary: 美股交易时段
      description: |
        返回当前时段（盘前 / 开盘 / 盘后 / 隔夜 / 休市）、距下一次切换的倒计时，
        以及给定区间内的时段分段（用于图表底部的时段色带与轴标签）。
        链上产品 24×7 可交易，但不同时段的参考价新鲜度与深度不同。
      operationId: getMarketSessions
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: OK
          content:
            application/json:
