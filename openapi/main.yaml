openapi: 3.0.3
info:
  title: Orbit RWA Trading API
  version: 0.1.0
  description: |
    RWA 股票交易 App（bStocks 现货 + HIP-3 永续）后端接口。

    Orbit App 的完整后端接口定义，覆盖原型 `rwa-trading-prototype` 的全部功能：

    * **认证与交易钱包** — 完全基于 [Privy](https://docs.privy.io)，App 不自建密码体系。
      用户用邮箱验证码 / Apple / Google 在 Privy SDK 内完成登录，Privy 自动创建
      Embedded Wallet；App 后端校验 `privy_access_token` 后签发自己的 JWT。
      登录与注册合并为单个 `POST /auth/session`。
    * **行情** — 股票分组、榜单（热门 / 涨幅 / 跌幅 / 成交量）、K 线、美股参考价、交易时段。
    * **交易** — bStocks 现货（Market / Limit + TP/SL）与 HIP-3 永续（Isolated / Cross、杠杆、TP/SL）。
    * **持仓** — 现货持仓与合约仓位、改单、部分 / 全部平仓。
    * **设置** — 语言、版本检查、缓存。

    ## 两条产品线

    | | `bstock`（现货） | `perp`（合约） |
    |---|---|---|
    | 市场 | BSC bStocks Token | HIP-3 Perpetual |
    | 资产结果 | BSC Wallet 内的链上证券代币 | HIP-3 合约仓位 |
    | 计价 | USDC | USD |
    | 保证金 | 无 | Isolated / Cross |

    ## 约定

    * 所有金额、价格、数量均为 **十进制字符串**（如 `"183.25"`），避免浮点精度问题。
    * 所有时间为 **RFC 3339 UTC**（如 `2026-08-27T02:15:00Z`）。
    * 可增长的列表接口统一使用 **cursor 分页**；账户角色、版本等有自然上限的小集合例外。
    * 枚举类型的可选字段（如 `margin_mode`、`chain`）在不适用时 **省略该字段**，
      而不是返回 `null` —— 这样客户端生成的枚举类型可以保持共享且非空。
      其余可空字段显式标注 `nullable: true`。
    * 写操作接受 `Idempotency-Key` 请求头。
    * 错误统一返回 `Error` 结构。
    * **`401` 不在各接口单独声明** —— 除标注 `security: []` 的公开接口外，
      所有接口在 JWT 缺失、失效或过期时都返回 `401` + `Error`，客户端统一在
      拦截器里处理（重新用 Privy token 调 `POST /auth/session` 换 JWT 后重试）。
      各接口的 `responses` 只列该接口特有的错误（`400` / `404` / `409` / `422`）。

  contact:
    name: Orbit API
  license:
    name: Proprietary

servers:
  - url: https://api.orbit.example.com/v1
    description: Production
  - url: https://api-staging.orbit.example.com/v1
    description: Staging
  - url: http://localhost:8000/v1
    description: Local

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Privy 登录 / 注册 / 会话
  - name: Account
    description: 账户资料与应用设置
  - name: Markets
    description: 股票、产品、榜单、行情统计
  - name: Charts
    description: K 线、参考价曲线、交易时段
  - name: Positions
    description: 现货持仓与合约仓位
  - name: Portfolio
    description: 总资产与持仓概览
  - name: System
    description: 版本、配置、静态文案

paths:
  # ==========================================================================
  # Auth — Privy
  # ==========================================================================
  /auth/config:
    get:
      tags: [Auth]
      summary: 获取客户端 Privy 配置
      description: |
        Flutter 端启动时拉取，用于初始化 Privy SDK。避免把 App ID / 支持的登录方式硬编码在客户端。
      operationId: getAuthConfig
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivyClientConfig' }

  /auth/session:
    post:
      tags: [Auth]
      summary: 登录 / 注册（Privy Token 兑换）
      description: |
        **唯一的登录注册入口。**

        客户端先用 Privy Flutter SDK 完成身份验证 —— 邮箱验证码
        （`privy.email.sendCode()` → `privy.email.loginWithCode()`）或 Apple / Google OAuth
        （`privy.oAuth.login()`）—— 拿到 `privy_access_token` 后调用本接口换取 App JWT。

        验证码的发送与校验全程在 Privy SDK 与 Privy 服务之间完成，本后端不接触验证码，
        也不保存密码。因此：

        * **没有独立的注册接口** —— 首次调用即注册，响应 `created=true`；之后为登录，`created=false`。
        * **没有忘记密码流程** —— 用户重新走一次邮箱验证码即可。
        * 原型中的「设置密码 / 输入密码 / 忘记密码」三屏在 Privy 方案下不再需要。

        后端流程（对齐 `agent-gateway-service` 的 `/auth/register` + `/auth/token`）：

        1. 用 Privy JWKS 验签 `privy_access_token`，取出 `did`；
        2. 调 Privy `GET /api/v1/users/{did}` 拉取 linked accounts 与钱包；
        3. 新用户则建号，落库 `privy_did`、`wallet_address`、`primary_evm_wallet_id`；
        4. 开通 bStocks（BSC）与 HIP-3（Hyperliquid）交易账户；
        5. 签发 App 自己的 JWT。

        **交易钱包由 Privy 在登录时自动创建，前端无需额外的钱包确认步骤。**

        App 冷启动时也调用本接口做静默登录：Privy SDK 会自动续期它自己的会话，
        拿到新的 `privy_access_token` 后换一个新的 App JWT 即可。

        **App JWT 过期后走的也是同一条路** —— 没有独立的 refresh 接口，
        客户端在收到 `401` 时重新取 Privy token 并再调一次本接口即可。
      security: []
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionRequest' }
      responses:
        '200':
          description: 登录成功；账户与资产已恢复
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '201':
          description: 注册成功；交易钱包已自动创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401':
          description: Privy token 无效或已过期
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Auth]
      summary: 退出登录
      description: |
        使当前 App JWT 失效。不删除账户与资产，重新登录后自动恢复。
        客户端还需另外调用 Privy SDK 的 `privy.logout()` 清除 Privy 侧会话。
      operationId: deleteSession
      responses:
        '204': { description: 已退出 }

  # ==========================================================================
  # Account
  # ==========================================================================
  /me:
    get:
      tags: [Account]
      summary: 当前登录账户
      description: 用户偏好作为 `settings` 子对象一并返回；更新走 `PATCH /me/settings`。
      operationId: getMe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
  /me/settings:
    patch:
      tags: [Account]
      summary: 更新当前用户的设置
      description: |
        部分更新：**所有字段都是可选的，传什么改什么，未传的字段保持不变**。

        **没有对应的 `GET`** —— 设置作为 `User.settings` 子对象随 `GET /me` 一起返回，
        只存在一份定义，不会出现两个来源不一致的情况。
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserSettingsUpdate' }
      responses:
        '200':
          description: 返回更新后的完整设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /me/devices:
    get:
      tags: [Account]
      summary: 已注册的推送设备
      operationId: listDevices
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Device' }
    post:
      tags: [Account]
      summary: 注册 / 更新当前设备的推送令牌
      description: |
        按 `device_id` upsert。APNs / FCM 令牌会在重装、系统升级、长期未启动后轮换，
        因此客户端应在 **每次启动拿到令牌时** 都调一次，而不只在登录时提交一次。

        登录时 `SessionRequest.device` 里带的信息等价于调用一次本接口，
        两者可任选其一；令牌轮换只能靠本接口。
      operationId: registerDevice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceRegisterRequest' }
      responses:
        '200':
          description: 已注册 / 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }

  /me/devices/{device_id}:
    delete:
      tags: [Account]
      summary: 注销推送设备
      description: 退出登录时调用，避免继续向该设备推送已登出账户的消息。
      operationId: deleteDevice
      parameters: [{ $ref: '#/components/parameters/DeviceId' }]
      responses:
        '204': { description: 已注销 }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==========================================================================
  # Markets
  # ==========================================================================
  /markets/stocks:
    get:
      tags: [Markets]
      summary: 股票分组列表
      description: |
        市场页「股票」Tab。每支股票包含美股参考价与其支持的产品（bStocks / HIP-3），
        每个产品带自己的链上价格与相对参考价的价差。
      operationId: listStocks
      parameters:
        - name: q
          in: query
          description: 按代码或公司名模糊搜索
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/StockGroup' }

  /markets/products:
    get:
      tags: [Markets]
      summary: 产品列表 / 分组
      description: |
        首页和市场页的扁平产品列表统一数据源。用 `group` 区分「热门 / 涨幅 /
        跌幅 / 成交量 / 自选」；`favorites` 仅返回当前登录用户的自选产品。
        `product_type` 对应首页一级筛选（全部 / 现货 / 合约）。每项仍带
        `is_favorite`，用于渲染收藏状态。
      operationId: listProducts
      parameters:
        - name: group
          in: query
          description: 列表分组；`favorites` 为当前用户自选列表
          schema: { $ref: '#/components/schemas/MarketProductGroup' }
        - name: product_type
          in: query
          schema: { $ref: '#/components/schemas/ProductType' }
        - name: q
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      caption:
                        type: string
                        description: 分组标题，如 `Losers · 24h 跌幅榜` 或 `Favorites · 自选`
                        example: Hot · 热门产品
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ProductListing' }

  /markets/{symbol}/products/{kind}:
    get:
      tags: [Markets]
      summary: 产品详情
      description: 详情页顶部报价、产品说明、资产权益与行情统计的聚合接口。
      operationId: getProduct
      parameters:
        - $ref: '#/components/parameters/Symbol'
        - $ref: '#/components/parameters/ProductKind'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /markets/{symbol}/products/{kind}/stats:
    get:
      tags: [Markets]
      summary: 24h 行情统计
      description: |
        24h 高 / 低、成交额、成交量、参考价与相对偏离（bStocks 为 Premium，HIP-3 为 Basis）、
        价差、买一卖一；HIP-3 额外返回资金费率与未平仓合约量。
      operationId: getProductStats
      parameters:
        - $ref: '#/components/parameters/Symbol'
        - $ref: '#/components/parameters/ProductKind'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketStats' }

  /markets/{symbol}/products/{kind}/orderbook:
    get:
      tags: [Markets]
      summary: 订单簿深度
      operationId: getOrderBook
      parameters:
        - $ref: '#/components/parameters/Symbol'
        - $ref: '#/components/parameters/ProductKind'
        - name: depth
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderBook' }

  /markets/{symbol}/asset-info:
    get:
      tags: [Markets]
      summary: 资产详情与权益
      description: |
        「资产详情与权益」弹窗的内容。bStocks 说明发行方、1:1 股票支持、公司行动、
        股息再投资、投票权；HIP-3 说明合约形态、无股东权益、保证金模式、资金费率方向。
      operationId: getAssetInfo
      parameters:
        - $ref: '#/components/parameters/Symbol'
        - name: kind
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ProductKind' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetInfo' }

  /markets/favorites:
    put:
      tags: [Markets]
      summary: 覆盖自选列表（用于排序）
      description: |
        仅用于将当前用户已有自选产品整体重新排序。读取自选列表统一使用
        `GET /markets/products?group=favorites`。
      operationId: replaceFavorites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/ProductRef' }
      responses:
        '204': { description: 已更新 }

  /markets/{symbol}/products/{kind}/favorite:
    put:
      tags: [Markets]
      summary: 加入自选
      description: 幂等操作。路径放在产品资源下，避免与产品详情路由产生模板歧义。
      operationId: addFavorite
      parameters:
        - $ref: '#/components/parameters/Symbol'
        - $ref: '#/components/parameters/ProductKind'
      responses:
        '204': { description: 已加入 }
    delete:
      tags: [Markets]
      summary: 取消自选
      description: 幂等操作。
      operationId: removeFavorite
      parameters:
        - $ref: '#/components/parameters/Symbol'
        - $ref: '#/components/parameters/ProductKind'
      responses:
        '204': { description: 已取消 }

  # ==========================================================================
  # Charts & Sessions
  # ==========================================================================
  /markets/{symbol}/products/{kind}/candles:
    get:
      tags: [Charts]
      summary: K 线 / 价格序列
      description: |
        详情页图表数据。同时返回链上产品价格序列与美股参考价序列 —— 参考价仅在
        美股有报价的时段（盘前 / 开盘 / 盘后）存在，其余时段为空洞，前端据此画虚线。
      operationId: getCandles
      parameters:
        - $ref: '#/components/parameters/Symbol'
        - $ref: '#/components/parameters/ProductKind'
        - name: range
          in: query
          description: 预设区间；与 `from` / `to` 二选一
          schema: { $ref: '#/components/schemas/ChartRange' }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: interval
          in: query
          description: 采样粒度，缺省由 `range` 推导
          schema:
            type: string
            enum: [1m, 5m, 15m, 1h, 4h, 1d]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandleSeries' }

  /markets/sessions:
    get:
      tags: [Charts]
      summary: 美股交易时段
      description: |
        返回当前时段（盘前 / 开盘 / 盘后 / 隔夜 / 休市）、距下一次切换的倒计时，
        以及给定区间内的时段分段（用于图表底部的时段色带与轴标签）。
        链上产品 24×7 可交易，但不同时段的参考价新鲜度与深度不同。
      operationId: getMarketSessions
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketSessionInfo' }

  /markets/{symbol}/reference-price:
    get:
      tags: [Charts]
      summary: 美股参考价
      description: 最近一次美股参考报价及其时段与新鲜度。休市时停留在最近收盘价。
      operationId: getReferencePrice
      parameters: [{ $ref: '#/components/parameters/Symbol' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferencePrice' }

  # ==========================================================================
  # Positions
  # ==========================================================================
  /positions:
    get:
      tags: [Positions]
      summary: 持仓列表
      description: |
        同时返回 bStocks 现货持仓与 HIP-3 合约仓位。资产页按股票分组展示，
        详情页按 `symbol` + `kind` 过滤后展示单个仓位。
      operationId: listPositions
      parameters:
        - name: symbol
          in: query
          schema: { type: string }
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/ProductKind' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Position' }
                      total_value_usd: { $ref: '#/components/schemas/Decimal' }

  /positions/{position_id}:
    get:
      tags: [Positions]
      summary: 仓位详情
      operationId: getPosition
      parameters: [{ $ref: '#/components/parameters/PositionId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Position' }
        '404': { $ref: '#/components/responses/NotFound' }

  /positions/{position_id}/tpsl:
    put:
      tags: [Positions]
      summary: 设置 / 修改止盈止损
      description: |
        对应「编辑止盈止损」弹窗。校验规则：
        Long 时 TP 需高于入场价、SL 需低于入场价；Short 反之。
        传 `null` 表示清除该条件单。
      operationId: updatePositionTpSl
      parameters: [{ $ref: '#/components/parameters/PositionId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TpSlUpdateRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Position' }
        '422':
          description: TP / SL 价格不满足方向约束
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Positions]
      summary: 清除止盈止损
      operationId: clearPositionTpSl
      parameters: [{ $ref: '#/components/parameters/PositionId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Position' }

  /positions/{position_id}/close:
    post:
      tags: [Positions]
      summary: 平仓（支持部分平仓）
      description: |
        HIP-3 仓位的市价 / 限价平仓，可指定数量或百分比。
        bStocks 现货的「卖出」走 `POST /orders`，本接口仅用于合约。
      operationId: closePosition
      parameters:
        - $ref: '#/components/parameters/PositionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClosePositionRequest' }
      responses:
        '201':
          description: 平仓单已提交
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '422': { $ref: '#/components/responses/BadRequest' }

  /positions/{position_id}/leverage:
    patch:
      tags: [Positions]
      summary: 调整杠杆 / 保证金模式
      operationId: updatePositionLeverage
      parameters: [{ $ref: '#/components/parameters/PositionId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                leverage: { type: integer, minimum: 1, maximum: 50, example: 2 }
                margin_mode: { $ref: '#/components/schemas/MarginMode' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Position' }

  # ==========================================================================
  # Portfolio
  # ==========================================================================
  /portfolio/summary:
    get:
      tags: [Portfolio]
      summary: 资产总览
      description: |
        资产页顶部：总资产、今日盈亏、可用于交易的金额（Available to trade）、
        占用保证金（Margin in use）。
      operationId: getPortfolioSummary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortfolioSummary' }

  /portfolio/accounts:
    get:
      tags: [Portfolio]
      summary: 各账户余额
      description: |
        App 采用三段式账户结构，前端在资金流程中需要分别展示：

        * `app` —— App 可用余额（聚合账户，入金默认到账处）；
        * `bstocks` —— BSC Wallet，bStocks 现货交易账户；
        * `hip3` —— HIP-3 交易账户（Hyperliquid 保证金）。
      operationId: listAccounts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AccountBalance' }

  /portfolio/holdings:
    get:
      tags: [Portfolio]
      summary: 按股票分组的持仓
      description: 资产页 Stocks 区块：每支股票一组，组内列出该股票下的各产品持仓。
      operationId: listHoldings
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items, total_value_usd]
                    properties:
                      total_value_usd: { $ref: '#/components/schemas/Decimal' }
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/HoldingGroup' }

  # ==========================================================================
  # System
  # ==========================================================================
  /system/app-version:
    get:
      tags: [System]
      summary: 各平台最新版本
      description: |
        返回所有平台的版本信息。客户端拿自己的版本和对应平台的条目比较：

        * `current < min_supported_version` → 强制升级，阻断使用
        * `current < latest_version` → 提示有新版本，可跳过

        比较放在客户端而不是服务端，是为了避免「查版本」这一个接口出现
        「带参数算结果」和「不带参数列数据」两种模式。
      operationId: listAppVersions
      security: []
      parameters:
        - name: platform
          in: query
          description: 只取某个平台；不传则返回全部
          schema: { $ref: '#/components/schemas/Platform' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [platforms]
                properties:
                  platforms:
                    type: array
                    items: { $ref: '#/components/schemas/AppVersionInfo' }

  /system/app-version/{platform}:
    put:
      tags: [System]
      summary: 发布 / 更新某平台的版本号
      description: |
        **运维 / CI 用**，不面向 App。发版后由流水线调用，覆盖该平台的版本记录。

        鉴权用独立的服务令牌 `X-Admin-Token`（见 `adminToken`），
        与用户 JWT 完全隔离 —— 用户 JWT 调不通，这个令牌也调不了任何用户接口。
        按 `platform` upsert：平台不存在则创建，存在则整条覆盖。
      operationId: putAppVersion
      security:
        - adminToken: []
      parameters:
        - name: platform
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Platform' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppVersionUpsert' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppVersionInfo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: 服务令牌无效
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /system/disclosures:
    get:
      tags: [System]
      summary: 产品说明文案
      description: |
        返回 24×7 交易说明、各交易时段说明、产品风险提示等长文案，
        便于不发版调整措辞与多语言。
      operationId: getDisclosures
      security: []
      parameters:
        - name: locale
          in: query
          schema: { type: string, example: zh-CN }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Disclosures' }

  /events:
    get:
      tags: [System]
      summary: 实时事件流（SSE）
      description: |
        Server-Sent Events。推送价格、订单状态、持仓与余额变化，
        替代前端轮询。每条事件同时以 SSE 的 `id:` 字段和载荷的 `event_id` 给出可续传
        标识；断线重连时客户端带上最近收到的 `Last-Event-ID`，服务端补发其后的事件。
        事件名与强类型 `data` 结构见 `RealtimeEvent`。
      operationId: streamEvents
      parameters:
        - name: channels
          in: query
          description: 订阅频道，如 `prices:NVDA:perp,orders,positions`
          schema: { type: string }
        - $ref: '#/components/parameters/LastEventId'
      responses:
        '200':
          description: 事件流
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/RealtimeEvent' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        App 自签的 JWT，由 `POST /auth/session` 用 Privy access token 换取。
        **不要**直接把 Privy access token 当作本 API 的凭证。
    adminToken:
      type: apiKey
      in: header
      name: X-Admin-Token
      description: |
        运维 / CI 使用的固定服务令牌，只用于 `PUT /system/app-version/{platform}`。
        与用户体系完全隔离：它调不了任何用户接口，用户 JWT 也调不了它的接口。
        轮换方式由部署侧决定（环境变量 / 密钥管理），不通过 API 下发。

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: 客户端生成的唯一键（建议 UUID v4）。重复提交返回首次的结果。
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      description: 上一页返回的 `next_cursor`
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    LastEventId:
      name: Last-Event-ID
      in: header
      description: |
        SSE 断线重连时传入最后成功处理的 `event_id`。服务端应从该事件之后补发；
        若保留窗口已过期，则发送一条 `resync_required` 事件并由客户端重新拉取快照。
      schema: { type: string }
    Symbol:
      name: symbol
      in: path
      required: true
      description: 股票代码
      schema: { type: string, example: NVDA }
    ProductKind:
      name: kind
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ProductKind' }
    OrderId:
      name: order_id
      in: path
      required: true
      schema: { type: string }
    PositionId:
      name: position_id
      in: path
      required: true
      schema: { type: string }
    DeviceId:
      name: device_id
      in: path
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: 请求参数不合法
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # ---------------------------------------------------------------- 基础类型
    Decimal:
      type: string
      description: 十进制字符串，避免浮点误差
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
      example: '183.25'

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 机器可读错误码
          example: insufficient_funds
        message:
          type: string
          description: 面向用户的提示文案（按 `Accept-Language` 本地化）
          example: 可用余额不足，请先准备资金
        details:
          type: object
          additionalProperties: true
          nullable: true
        request_id: { type: string, nullable: true }

    Page:
      type: object
      required: [next_cursor, has_more]
      properties:
        next_cursor:
          type: string
          nullable: true
          description: 为 `null` 表示没有更多数据
        has_more: { type: boolean }

    ProductKind:
      type: string
      description: |
        产品类型：
        * `bstock` —— BSC bStocks Token（现货）
        * `perp` —— HIP-3 Perpetual（永续合约）
      enum: [bstock, perp]
      example: bstock

    ProductType:
      type: string
      description: 首页 / 市场页一级筛选
      enum: [all, spot, contract]
      default: all

    MarketProductGroup:
      type: string
      description: |
        市场产品列表分组。`favorites` 仅表示当前登录用户的自选产品，其他值为全市场排行。
      enum: [hot, gainers, losers, volume, favorites]
      default: hot

    Chain:
      type: string
      enum: [BSC, Arbitrum, Base, Ethereum, Hyperliquid, Polygon, Solana]

    AccountKind:
      type: string
      description: |
        * `app` —— App 可用余额（聚合账户）
        * `bstocks` —— BSC Wallet，bStocks 交易账户
        * `hip3` —— HIP-3 交易账户
      enum: [app, bstocks, hip3]

    OrderSide:
      type: string
      description: 现货用 `buy` / `sell`；合约用 `long` / `short`
      enum: [buy, sell, long, short]

    OrderType:
      type: string
      enum: [market, limit]

    MarginMode:
      type: string
      enum: [isolated, cross]

    ChartRange:
      type: string
      enum: ['15m', '4h', '24h', '1w']
      default: '24h'

    SessionKind:
      type: string
      description: 美股交易时段：盘前 / 开盘 / 盘后 / 隔夜 / 周末休市 / 节假日休市
      enum: [premarket, regular, after, overnight, weekend, holiday]

    # ---------------------------------------------------------------- Auth
    PrivyClientConfig:
      type: object
      required: [privy_app_id, login_methods]
      properties:
        privy_app_id: { type: string, example: clxxxxxxxxxxxxxxxxxxx }
        privy_client_id:
          type: string
          nullable: true
          description: Privy 移动端 client ID（iOS / Android 分别配置时使用）
        login_methods:
          type: array
          items: { type: string, enum: [email, apple, google] }
        embedded_wallet:
          type: object
          description: Embedded Wallet 创建策略
          properties:
            create_on_login: { type: string, enum: [users-without-wallets, all-users, off] }
            chains:
              type: array
              items: { $ref: '#/components/schemas/Chain' }
        terms_url: { type: string, format: uri }
        privacy_url: { type: string, format: uri }

    SessionRequest:
      type: object
      required: [privy_access_token]
      properties:
        privy_access_token:
          type: string
          description: |
            Privy 签发的 access token，由客户端 SDK 在邮箱验证码或 OAuth 登录成功后取得
            （Flutter: `privyUser.getAccessToken()`）。后端用 Privy JWKS 验签。
        privy_identity_token:
          type: string
          nullable: true
          description: |
            可选。Privy identity token 内含 linked accounts 与钱包快照，
            后端带上它可省掉一次 `GET /api/v1/users/{did}` 调用。
        language:
          type: string
          nullable: true
          description: 注册时的初始语言；已有账户忽略此字段
          example: zh-CN
        device: { $ref: '#/components/schemas/DeviceInfo' }

    Platform:
      type: string
      description: |
        客户端平台。当前为 `ios` / `android`，**后续可能新增**（如 `harmony`、`web`）。

        这里刻意用开放字符串而不是枚举：服务端新增平台时，老客户端反序列化
        不会因为遇到未知枚举值而崩溃。客户端只需认得自己那个值。
      example: ios

    DeviceInfo:
      type: object
      description: |
        登录时一并提交的设备信息，等价于调用一次 `POST /me/devices`。
        令牌轮换必须走 `POST /me/devices`。
      properties:
        device_id:
          type: string
          description: 客户端生成并持久化的设备标识，用于 upsert
        platform: { $ref: '#/components/schemas/Platform' }
        app_version: { type: string, example: 1.0.0 }
        push_token: { type: string, nullable: true }

    DeviceRegisterRequest:
      type: object
      required: [device_id, platform, push_token]
      properties:
        device_id: { type: string }
        platform: { $ref: '#/components/schemas/Platform' }
        app_version:
          type: string
          nullable: true
          example: 1.2.0
          description: |
            当前安装的版本号，可选。**用途是推送内容分流，不是设备统计**——
            比如老版本不支持富通知（图片 / 按钮）或某种深链格式时，
            后端据此回退成纯文本推送，避免老版本收到解析不了的 payload。

            与令牌一样会过期：客户端每次上报令牌时应一并带上当前版本号，
            不需要单独维护更新时机。
        push_token:
          type: string
          description: APNs / FCM 推送令牌
        push_provider:
          type: string
          enum: [apns, fcm]
          description: 不传则由后端按 `platform` 推断

    Device:
      type: object
      required: [device_id, platform]
      properties:
        device_id: { type: string }
        platform: { $ref: '#/components/schemas/Platform' }
        app_version:
          type: string
          nullable: true
          description: 用于推送内容分流；客户端未上报过时为 null
        push_provider: { type: string, enum: [apns, fcm], nullable: true }
        push_token_registered:
          type: boolean
          description: 出于安全考虑不回显令牌本身，只告知是否已登记
        last_seen_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    SessionResponse:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, default: bearer }
        expires_in:
          type: integer
          description: |
            App JWT 有效期（秒）。过期后客户端从 Privy SDK 取一个新的
            `privy_access_token` 再调一次本接口即可，无需单独的 refresh 流程。
          example: 3600
        created:
          type: boolean
          description: 本次调用是否创建了新账户（社交登录首次进入时为 `true`）
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      description: |
        账户主体，只放 **Privy 给不了的** 信息。

        邮箱、登录方式这些属于 Privy 的身份数据，客户端登录后已经拿在手里
        （`privyUser.linkedAccounts`），本接口不再重复返回一份 —— 两份数据
        同步不及时反而会不一致。设置页的「当前登录账户」直接读 SDK。

        用户偏好收在 `settings` 子对象里，更新走 `PATCH /me/settings`。
      required: [user_id, settings]
      properties:
        user_id: { type: string, format: uuid }
        privy_did:
          type: string
          description: Privy 用户 DID
          example: did:privy:clxxxxxxxxxxxxxxxxxxx
        display_name: { type: string, nullable: true }
        avatar_url: { type: string, format: uri, nullable: true }
        settings: { $ref: '#/components/schemas/UserSettings' }
        created_at: { type: string, format: date-time }

    UserSettings:
      type: object
      description: 需要跨设备保留的用户偏好。随 `GET /me` 返回，用 `PATCH /me/settings` 更新。
      required:
        - language
        - push_enabled
        - notify_order_filled
        - notify_order_failed
        - notify_liquidation_warning
      properties:
        language:
          type: string
          enum: [zh-CN, en]
          default: zh-CN
          description: |
            界面语言。服务端也用它决定推送通知的语言 —— 推送由后端发起，
            拿不到请求头里的 `Accept-Language`，所以这个偏好必须存在服务端。
        push_enabled:
          type: boolean
          default: true
          description: |
            推送总开关。关闭后后端不再向该用户的任何设备推送，
            下面三个分类开关的取值被忽略（但保留，重新打开总开关后恢复原样）。
        notify_order_filled:
          type: boolean
          default: true
          description: 订单成交。市价成交、限价单被撮合、止盈止损触发都归这一类。
        notify_order_failed:
          type: boolean
          default: true
          description: 订单失败。下单被拒、超出滑点、资金准备失败等。
        notify_liquidation_warning:
          type: boolean
          default: true
          description: |
            强平预警。仅对 HIP-3 合约仓位有效，现货持仓不会触发。
            触发阈值由平台统一设定，暂不支持用户自定义。

    UserSettingsUpdate:
      type: object
      description: |
        `PATCH /me/settings` 的请求体。**所有字段可选，传什么改什么**；
        未出现的字段保持原值，不会被重置。
      properties:
        language: { type: string, enum: [zh-CN, en] }
        push_enabled: { type: boolean }
        notify_order_filled: { type: boolean }
        notify_order_failed: { type: boolean }
        notify_liquidation_warning: { type: boolean }

    KeyValue:
      type: object
      required: [label, value]
      properties:
        label: { type: string, example: 授权额度 }
        value: { type: string, example: 500.00 USDT }
        tone:
          type: string
          nullable: true
          enum: [default, positive, negative, muted]

    # ---------------------------------------------------------------- Markets
    ProductRef:
      type: object
      required: [symbol, kind]
      properties:
        symbol: { type: string, example: NVDA }
        kind: { $ref: '#/components/schemas/ProductKind' }

    Stock:
      type: object
      required: [symbol, name, reference_price]
      properties:
        symbol: { type: string, example: NVDA }
        name: { type: string, example: NVIDIA }
        logo_url: { type: string, format: uri, nullable: true }
        logo_text:
          type: string
          description: 无图时的占位字母
          example: NV
        reference_price:
          allOf: [{ $ref: '#/components/schemas/Decimal' }]
          description: 美股最近参考价
        reference_session: { $ref: '#/components/schemas/SessionKind' }
        reference_at: { type: string, format: date-time }

    StockGroup:
      type: object
      description: 市场页「股票」Tab 的一张卡片
      required: [stock, products]
      properties:
        stock: { $ref: '#/components/schemas/Stock' }
        products:
          type: array
          items: { $ref: '#/components/schemas/ProductListing' }

    ProductListing:
      type: object
      description: 榜单 / 分组中的单个产品行
      required: [symbol, kind, price]
      properties:
        symbol: { type: string, example: NVDA }
        name: { type: string, example: NVIDIA }
        kind: { $ref: '#/components/schemas/ProductKind' }
        product_type: { type: string, enum: [spot, contract] }
        label:
          type: string
          description: 展示名，`bStocks` 或 `HIP-3`
          example: bStocks
        price: { $ref: '#/components/schemas/Decimal' }
        change_24h_percent:
          allOf: [{ $ref: '#/components/schemas/Decimal' }]
          description: 24h 涨跌幅（百分比数值，如 `"0.47"`）
        spread_vs_reference_percent:
          allOf: [{ $ref: '#/components/schemas/Decimal' }]
          description: 相对美股参考价的价差百分比
        volume_24h:
          allOf: [{ $ref: '#/components/schemas/Decimal' }]
          description: 24h 成交量（以基础资产计价）
        volume_24h_unit: { type: string, example: NVDAB }
        turnover_24h_usd: { $ref: '#/components/schemas/Decimal' }
        hot_rank: { type: integer, nullable: true }
        is_favorite: { type: boolean, default: false }

    ProductDetail:
      type: object
      required: [symbol, kind, quote, asset_info]
      properties:
        symbol: { type: string }
        name: { type: string }
        kind: { $ref: '#/components/schemas/ProductKind' }
        title:
          type: string
          description: 产品标题，如 `BSC bStocks Token` / `HIP-3 Perpetual`
        badge:
          type: string
          description: 角标，如 `Spot · BSC` / `Isolated margin`
        description: { type: string, description: 产品说明长文案 }
        quote: { $ref: '#/components/schemas/Quote' }
        stats: { $ref: '#/components/schemas/MarketStats' }
        asset_info: { $ref: '#/components/schemas/AssetInfo' }
        trading_hours:
          type: string
          description: 交易时间说明
          enum: ['24x7', 'us_market_hours']
          default: '24x7'

    Quote:
      type: object
      required: [price]
      properties:
        label:
          type: string
          description: 报价说明，如 `Last traded · NVDAB/USDC` 或 `Mark price · NVDA-PERP`
        price: { $ref: '#/components/schemas/Decimal' }
        change_24h: { $ref: '#/components/schemas/Decimal' }
        change_24h_percent: { $ref: '#/components/schemas/Decimal' }
        updated_at: { type: string, format: date-time }

    MarketStats:
      type: object
      properties:
        high_24h: { $ref: '#/components/schemas/Decimal' }
        low_24h: { $ref: '#/components/schemas/Decimal' }
        turnover_24h_usd: { $ref: '#/components/schemas/Decimal' }
        volume_24h: { $ref: '#/components/schemas/Decimal' }
        volume_24h_unit: { type: string, example: NVDAB }
        reference_label:
          type: string
          description: bStocks 为 `US Stock Reference`；HIP-3 为 `Spot / Reference Price`
        reference_price: { $ref: '#/components/schemas/Decimal' }
        relative_label:
          type: string
          description: bStocks 为 `Premium`；HIP-3 为 `Basis`
        relative_percent: { $ref: '#/components/schemas/Decimal' }
        spread_percent: { $ref: '#/components/schemas/Decimal' }
        best_bid: { $ref: '#/components/schemas/Decimal' }
        best_ask: { $ref: '#/components/schemas/Decimal' }
        funding_rate:
          type: string
          nullable: true
          description: 仅 HIP-3。正费率多头付空头，负费率反向。
        next_funding_at: { type: string, format: date-time, nullable: true }
        open_interest_usd:
          type: string
          nullable: true
          description: 仅 HIP-3

    OrderBook:
      type: object
      required: [bids, asks]
      properties:
        bids:
          type: array
          items: { $ref: '#/components/schemas/OrderBookLevel' }
        asks:
          type: array
          items: { $ref: '#/components/schemas/OrderBookLevel' }
        updated_at: { type: string, format: date-time }

    OrderBookLevel:
      type: object
      required: [price, size]
      properties:
        price: { $ref: '#/components/schemas/Decimal' }
        size: { $ref: '#/components/schemas/Decimal' }

    AssetInfo:
      type: object
      description: 资产详情与权益
      required: [title, badge, description, rows]
      properties:
        title: { type: string, example: BSC bStocks Token }
        badge: { type: string, example: Spot · BSC }
        description:
          type: string
          example: 获得 NVIDIA 底层证券的经济敞口；持有的是 BSC 钱包内的链上证券代币，不是 NVIDIA 股份的直接所有权。
        rows:
          type: array
          description: |
            权益明细。bStocks 典型项：发行方 / 资产支持 / 公司行动 / 股息再投资 /
            股息形式 / 投票权 / 资产结果。HIP-3 典型项：产品形态 / 底层权益 /
            保证金模式 / 股息再投资 / 资金费率 / 费率方向 / 资产结果。
          items: { $ref: '#/components/schemas/KeyValue' }

    # ---------------------------------------------------------------- Charts
    CandleSeries:
      type: object
      required: [symbol, kind, range, points]
      properties:
        symbol: { type: string }
        kind: { $ref: '#/components/schemas/ProductKind' }
        range: { $ref: '#/components/schemas/ChartRange' }
        interval: { type: string, example: 5m }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        change_absolute:
          allOf: [{ $ref: '#/components/schemas/Decimal' }]
          description: 区间涨跌额，用于图表标题 `+$4.12 (+2.31%) 24h`
        change_percent: { $ref: '#/components/schemas/Decimal' }
        points:
          type: array
          description: 链上产品价格序列
          items: { $ref: '#/components/schemas/CandlePoint' }
        reference_points:
          type: array
          description: |
            美股参考价序列。仅在美股有报价的时段有值 —— 隔夜与休市时段为空洞，
            前端应断开连线或画虚线。
          items: { $ref: '#/components/schemas/CandlePoint' }
        sessions:
          type: array
          description: 该区间内的时段分段，用于绘制底部色带
          items: { $ref: '#/components/schemas/SessionSegment' }

    CandlePoint:
      type: object
      required: [t, c]
      properties:
        t: { type: string, format: date-time, description: 该点时间 }
        o: { $ref: '#/components/schemas/Decimal' }
        h: { $ref: '#/components/schemas/Decimal' }
        l: { $ref: '#/components/schemas/Decimal' }
        c: { allOf: [{ $ref: '#/components/schemas/Decimal' }], description: 收盘 / 该点价格 }
        v: { $ref: '#/components/schemas/Decimal' }

    SessionSegment:
      type: object
      required: [session, start, end]
      properties:
        session: { $ref: '#/components/schemas/SessionKind' }
        label: { type: string, example: 开盘 }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }

    MarketSessionInfo:
      type: object
      required: [current, timezone]
      properties:
        timezone: { type: string, example: America/New_York }
        current: { $ref: '#/components/schemas/SessionKind' }
        current_label: { type: string, example: 开盘 }
        current_description:
          type: string
          example: 传统美股主要交易时段，价格发现和成交最活跃。
        next_session: { $ref: '#/components/schemas/SessionKind' }
        next_transition_at: { type: string, format: date-time }
        seconds_until_transition:
          type: integer
          description: 距下一次时段切换的秒数，用于「距开盘 02:14:33」倒计时
        is_holiday: { type: boolean }
        holiday_name: { type: string, nullable: true }
        segments:
          type: array
          items: { $ref: '#/components/schemas/SessionSegment' }

    ReferencePrice:
      type: object
      required: [symbol, price, session, as_of]
      properties:
        symbol: { type: string }
        price: { $ref: '#/components/schemas/Decimal' }
        session: { $ref: '#/components/schemas/SessionKind' }
        as_of: { type: string, format: date-time }
        is_stale:
          type: boolean
          description: 休市 / 隔夜时段为 `true`，前端应提示参考价停留在最近收盘水平

    # ---------------------------------------------------------------- Trading
    OrderStatus:
      type: string
      description: |
        `pending_signature` 等待用户签名 · `submitted` 已提交 · `open` 挂单中 ·
        `partially_filled` 部分成交 · `filled` 已成交 · `cancelled` 已取消 · `failed` 失败
      enum: [pending_signature, submitted, open, partially_filled, filled, cancelled, failed]

    TpSlSpec:
      type: object
      description: |
        止盈止损。市价单只需 `stop_loss_price`（UI 上显示为 Stop Loss）；限价单额外可设
        `stop_limit_price`，此时 `stop_loss_price` 对应 UI 上的 Stop Trigger Price。
        Long / buy：TP 需高于入场价，SL 需低于入场价；Short / sell 反之。
      properties:
        enabled: { type: boolean, default: false }
        take_profit_price:
          type: string
          nullable: true
        stop_loss_price:
          type: string
          nullable: true
        stop_limit_price:
          type: string
          nullable: true
          description: 仅限价单
        take_profit_percent:
          type: string
          nullable: true
          description: 与价格互算，二者传其一即可
        stop_loss_percent:
          type: string
          nullable: true
        stop_limit_percent:
          type: string
          nullable: true
          description: 与 `stop_limit_price` 互算，二者传其一即可

    OrderRequestCommon:
      type: object
      required: [symbol, kind, side, type]
      properties:
        symbol: { type: string, example: NVDA }
        kind: { $ref: '#/components/schemas/ProductKind' }
        side: { $ref: '#/components/schemas/OrderSide' }
        type: { $ref: '#/components/schemas/OrderType' }
        slippage_percent:
          type: string
          nullable: true
          description: 最大可接受滑点；超出则下单失败
        tp_sl: { $ref: '#/components/schemas/TpSlSpec' }

    BstockOrderPreviewRequest:
      description: |
        bStocks 现货订单。只接受 `buy` / `sell`：市价买入传 `amount`，市价卖出传
        `quantity`，限价买卖均须传 `limit_price` 和 `quantity`。
      allOf:
        - $ref: '#/components/schemas/OrderRequestCommon'
        - type: object
          required: [kind, side, type]
          properties:
            kind: { type: string, enum: [bstock] }
            side: { type: string, enum: [buy, sell] }
            type: { $ref: '#/components/schemas/OrderType' }
            amount:
              type: string
              description: 市价买入时的 USDC 金额
            quantity:
              type: string
              description: 市价卖出或限价单的基础资产数量
            limit_price:
              type: string
              description: 限价单的 USDC 价格
        - oneOf:
            - type: object
              required: [amount]
              properties:
                side: { type: string, enum: [buy] }
                type: { type: string, enum: [market] }
            - type: object
              required: [quantity]
              properties:
                side: { type: string, enum: [sell] }
                type: { type: string, enum: [market] }
            - type: object
              required: [limit_price, quantity]
              properties:
                type: { type: string, enum: [limit] }

    PerpOrderPreviewRequest:
      description: |
        HIP-3 永续订单。只接受 `long` / `short`；市价单以 `amount` 表示 USD 名义价值，
        限价单须传 `limit_price` 和 `quantity`。杠杆、保证金模式和 `reduce_only` 仅适用于此类订单。
      allOf:
        - $ref: '#/components/schemas/OrderRequestCommon'
        - type: object
          required: [kind, side, type]
          properties:
            kind: { type: string, enum: [perp] }
            side: { type: string, enum: [long, short] }
            type: { $ref: '#/components/schemas/OrderType' }
            amount:
              type: string
              description: 市价单的 USD 名义价值
            quantity:
              type: string
              description: 限价单的基础资产数量
            limit_price:
              type: string
              description: 限价单的 USD 价格
            leverage: { type: integer, minimum: 1, maximum: 50 }
            margin_mode: { $ref: '#/components/schemas/MarginMode' }
            reduce_only: { type: boolean, default: false }
        - oneOf:
            - type: object
              required: [amount]
              properties:
                type: { type: string, enum: [market] }
            - type: object
              required: [limit_price, quantity]
              properties:
                type: { type: string, enum: [limit] }

    OrderPreviewRequest:
      description: 根据 `kind` 分派为 bStocks 现货或 HIP-3 永续订单。
      oneOf:
        - $ref: '#/components/schemas/BstockOrderPreviewRequest'
        - $ref: '#/components/schemas/PerpOrderPreviewRequest'
      discriminator:
        propertyName: kind
        mapping:
          bstock: '#/components/schemas/BstockOrderPreviewRequest'
          perp: '#/components/schemas/PerpOrderPreviewRequest'

    OrderPreview:
      type: object
      required: [preview_id, symbol, kind, side, type, order_value]
      properties:
        preview_id:
          type: string
          description: |
            本次报价的标识。下单时回传到 `CreateOrderRequest.preview_id` 可锁定价格；
            超过 `quote_expires_at` 后失效，需重新预览。
        symbol: { type: string }
        kind: { $ref: '#/components/schemas/ProductKind' }
        side: { $ref: '#/components/schemas/OrderSide' }
        type: { $ref: '#/components/schemas/OrderType' }
        market_price: { $ref: '#/components/schemas/Decimal' }
        estimated_price:
          allOf: [{ $ref: '#/components/schemas/Decimal' }]
          description: 预计成交价；与 `market_price` 不同时前端提示「价格已更新」
        price_updated:
          type: boolean
          description: 报价较用户上次看到的价格是否已变化
        estimated_quantity: { $ref: '#/components/schemas/Decimal' }
        estimated_receive:
          allOf: [{ $ref: '#/components/schemas/Decimal' }]
          description: 预计获得数量（扣除滑点后）
        estimated_receive_unit: { type: string, example: NVDAB }
        order_value: { $ref: '#/components/schemas/Decimal' }
        fee: { $ref: '#/components/schemas/Decimal' }
        fee_rate: { $ref: '#/components/schemas/Decimal' }
        slippage_percent: { $ref: '#/components/schemas/Decimal' }
        order_book_impact_percent: { $ref: '#/components/schemas/Decimal' }
        network_fee:
          type: string
          description: 网络费文案，如 `≈ $0.06 BNB` 或 `Included`
        settlement_account:
          allOf: [{ $ref: '#/components/schemas/AccountKind' }]
          description: 成交后资产的到账账户
        settlement_account_label: { type: string, example: BSC Wallet }
        margin_required:
          type: string
          nullable: true
        liquidation_price:
          type: string
          nullable: true
          description: 仅 HIP-3
        quote_expires_at: { type: string, format: date-time }
        details:
          type: array
          description: 「查看详情」中逐行展示的键值对
          items: { $ref: '#/components/schemas/KeyValue' }

    CreateOrderRequest:
      allOf:
        - $ref: '#/components/schemas/OrderPreviewRequest'
        - type: object
          properties:
            preview_id:
              type: string
              nullable: true
              description: 传入预览返回的报价 id 可锁定价格；过期后需重新预览

    Order:
      type: object
      required: [order_id, symbol, kind, side, type, status, created_at]
      properties:
        order_id: { type: string }
        client_order_id: { type: string, nullable: true }
        symbol: { type: string }
        kind: { $ref: '#/components/schemas/ProductKind' }
        side: { $ref: '#/components/schemas/OrderSide' }
        type: { $ref: '#/components/schemas/OrderType' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        limit_price:
          type: string
          nullable: true
        quantity: { $ref: '#/components/schemas/Decimal' }
        filled_quantity: { $ref: '#/components/schemas/Decimal' }
        average_fill_price:
          type: string
          nullable: true
        order_value: { $ref: '#/components/schemas/Decimal' }
        fee: { $ref: '#/components/schemas/Decimal' }
        leverage: { type: integer, nullable: true }
        margin_mode:
          $ref: '#/components/schemas/MarginMode'
        reduce_only: { type: boolean, default: false }
        tp_sl: { $ref: '#/components/schemas/TpSlSpec' }
        position_id: { type: string, nullable: true }
        realized_pnl:
          type: string
          nullable: true
          description: 平仓单的已实现盈亏
        tx_hash: { type: string, nullable: true }
        failure_reason:
          type: string
          nullable: true
          example: 超出设定滑点
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # -------------------------------------------------------------- Positions
    Position:
      type: object
      required: [position_id, symbol, kind, quantity, value_usd]
      properties:
        position_id: { type: string }
        symbol: { type: string }
        name: { type: string }
        kind: { $ref: '#/components/schemas/ProductKind' }
        side:
          type: string
          nullable: true
          enum: [long, short]
          description: 仅 HIP-3
        quantity: { $ref: '#/components/schemas/Decimal' }
        quantity_unit: { type: string, example: NVDAB }
        value_usd:
          allOf: [{ $ref: '#/components/schemas/Decimal' }]
          description: 现货为持仓市值，合约为仓位权益
        entry_price: { $ref: '#/components/schemas/Decimal' }
        mark_price: { $ref: '#/components/schemas/Decimal' }
        unrealized_pnl: { $ref: '#/components/schemas/Decimal' }
        unrealized_pnl_percent: { $ref: '#/components/schemas/Decimal' }
        realized_pnl: { $ref: '#/components/schemas/Decimal' }
        cost_basis: { $ref: '#/components/schemas/Decimal' }
        leverage: { type: integer, nullable: true }
        margin_mode:
          $ref: '#/components/schemas/MarginMode'
        margin:
          type: string
          nullable: true
        liquidation_price:
          type: string
          nullable: true
        funding_paid:
          type: string
          nullable: true
          description: 累计资金费；负数为支付，正数为收取
        take_profit_price:
          type: string
          nullable: true
        stop_loss_price:
          type: string
          nullable: true
        stop_limit_price:
          type: string
          nullable: true
          description: 已设置的止损限价；与 `stop_loss_price` 一起用于完整回显 TP / SL
        opened_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TpSlUpdateRequest:
      type: object
      properties:
        take_profit_price:
          type: string
          nullable: true
        stop_loss_price:
          type: string
          nullable: true
        stop_limit_price:
          type: string
          nullable: true
        stop_limit_percent:
          type: string
          nullable: true
          description: 与 `stop_limit_price` 互算，二者传其一即可

    ClosePositionRequest:
      type: object
      properties:
        type:
          allOf: [{ $ref: '#/components/schemas/OrderType' }]
          default: market
        quantity:
          type: string
          nullable: true
          description: 与 `percent` 二选一；均不传表示全部平仓
        percent:
          type: integer
          nullable: true
          minimum: 1
          maximum: 100
        limit_price:
          type: string
          nullable: true
        slippage_percent: { $ref: '#/components/schemas/Decimal' }

    # ---------------------------------------------------------------- Deposit
    DepositMode:
      type: string
      description: |
        * `wallet` —— 普通入金到 App 可用余额
        * `trade` —— 交易上下文中的入金，到账后需划转
        * `external_import` —— 直接导入对应交易账户，链 / Token 固定
      enum: [wallet, trade, external_import]

    DepositOptions:
      type: object
      required: [chains]
      properties:
        chains:
          type: array
          items:
            type: object
            required: [chain, tokens]
            properties:
              chain: { $ref: '#/components/schemas/Chain' }
              tokens:
                type: array
                items: { type: string }
                example: [USDC, USDT, BNB]
        recommended:
          type: object
          nullable: true
          description: 交易上下文下的推荐组合
          properties:
            chain: { $ref: '#/components/schemas/Chain' }
            token: { type: string }
            locked:
              type: boolean
              description: 为 `true` 时前端禁用链 / Token 选择器
            note:
              type: string
              example: 固定推荐 USDT · BSC · 直接导入 bStocks

    DepositAddress:
      type: object
      required: [chain, token, address]
      properties:
        chain: { $ref: '#/components/schemas/Chain' }
        token: { type: string }
        address: { type: string, example: '0x71F4B39A6D20A8' }
        memo:
          type: string
          nullable: true
          description: 部分链需要的备注 / tag
        qr_payload:
          type: string
          description: 二维码内容，通常是 `ethereum:0x…@56/transfer?address=…` 形式的 URI
        min_deposit: { $ref: '#/components/schemas/Decimal' }
        confirmations_required: { type: integer, example: 12 }
        credited_to: { $ref: '#/components/schemas/AccountKind' }
        warning:
          type: string
          example: 请仅向此地址转入 BSC 网络的 USDT。

    CreateDepositIntentRequest:
      type: object
      required: [chain, token]
      properties:
        chain: { $ref: '#/components/schemas/Chain' }
        token: { type: string }
        amount:
          type: string
          nullable: true
          description: 用户声明的转账金额，用于加速匹配
        mode:
          allOf: [{ $ref: '#/components/schemas/DepositMode' }]
          default: wallet
        tx_hash: { type: string, nullable: true }

    DepositStatus:
      type: string
      enum: [awaiting, confirming, credited, failed]

    Deposit:
      type: object
      required: [deposit_id, chain, token, status]
      properties:
        deposit_id: { type: string }
        chain: { $ref: '#/components/schemas/Chain' }
        token: { type: string }
        amount:
          type: string
          nullable: true
        status: { $ref: '#/components/schemas/DepositStatus' }
        confirmations: { type: integer }
        confirmations_required: { type: integer }
        credited_to: { $ref: '#/components/schemas/AccountKind' }
        requires_transfer:
          type: boolean
          description: |
            为 `true` 表示资金进入 App 可用余额，交易前仍需划转至交易账户；
            外部导入模式为 `false`。
        tx_hash: { type: string, nullable: true }
        activity_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        credited_at: { type: string, format: date-time, nullable: true }

    # ------------------------------------------------------------- Withdrawal
    WithdrawalQuoteRequest:
      type: object
      required: [asset, chain, amount]
      properties:
        asset: { type: string, example: USDC }
        chain: { $ref: '#/components/schemas/Chain' }
        amount: { $ref: '#/components/schemas/Decimal' }
        address: { type: string, nullable: true }

    WithdrawalQuote:
      type: object
      required: [quote_id, amount, estimated_receive, total_fee, sufficient]
      properties:
        quote_id:
          type: string
          description: 本次报价的标识，回传到 `CreateWithdrawalRequest.quote_id` 可锁定费率
        asset: { type: string }
        chain: { $ref: '#/components/schemas/Chain' }
        amount: { $ref: '#/components/schemas/Decimal' }
        needs_convert:
          type: boolean
          description: 目标资产非 USDC 时需内部 Convert
        convert_route: { type: string, nullable: true, example: 'USDC → USDT' }
        transfer_route: { type: string, example: 聚合账户 → BSC Wallet }
        needs_bridge: { type: boolean }
        bridge_route: { type: string, nullable: true, example: 'BSC → Base' }
        convert_transfer_fee: { $ref: '#/components/schemas/Decimal' }
        bridge_fee: { $ref: '#/components/schemas/Decimal' }
        network_fee: { $ref: '#/components/schemas/Decimal' }
        total_fee: { $ref: '#/components/schemas/Decimal' }
        estimated_receive: { $ref: '#/components/schemas/Decimal' }
        estimated_time: { type: string, example: 约 2–5 分钟 }
        sufficient:
          type: boolean
          description: 提现金额是否足以覆盖费用
        details:
          type: array
          items: { $ref: '#/components/schemas/KeyValue' }

    CreateWithdrawalRequest:
      type: object
      required: [asset, chain, amount, address]
      properties:
        asset: { type: string }
        chain: { $ref: '#/components/schemas/Chain' }
        amount: { $ref: '#/components/schemas/Decimal' }
        address: { type: string }
        memo: { type: string, nullable: true }
        quote_id: { type: string, nullable: true }
        save_address: { type: boolean, default: false }
        address_label: { type: string, nullable: true }

    WithdrawalStatus:
      type: string
      enum: [pending_signature, processing, sent, completed, failed]

    Withdrawal:
      type: object
      required: [withdrawal_id, asset, chain, amount, status]
      properties:
        withdrawal_id: { type: string }
        asset: { type: string }
        chain: { $ref: '#/components/schemas/Chain' }
        amount: { $ref: '#/components/schemas/Decimal' }
        received_amount:
          type: string
          nullable: true
        total_fee: { $ref: '#/components/schemas/Decimal' }
        address: { type: string }
        memo: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/WithdrawalStatus' }
        failure_reason: { type: string, nullable: true }
        tx_hash: { type: string, nullable: true }
        activity_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }

    SavedAddress:
      type: object
      required: [id, label, chain, address]
      properties:
        id: { type: string }
        label: { type: string }
        chain: { $ref: '#/components/schemas/Chain' }
        address: { type: string }
        last_used_at: { type: string, format: date-time, nullable: true }

    # -------------------------------------------------------------- Portfolio
    PortfolioSummary:
      type: object
      required: [total_value_usd, available_to_trade_usd]
      properties:
        total_value_usd: { $ref: '#/components/schemas/Decimal' }
        today_pnl_usd: { $ref: '#/components/schemas/Decimal' }
        today_pnl_percent: { $ref: '#/components/schemas/Decimal' }
        available_to_trade_usd:
          allOf: [{ $ref: '#/components/schemas/Decimal' }]
          description: 各交易账户中可直接下单的现金合计
        margin_in_use_usd: { $ref: '#/components/schemas/Decimal' }
        stocks_value_usd: { $ref: '#/components/schemas/Decimal' }
        updated_at: { type: string, format: date-time }

    AccountBalance:
      type: object
      required: [account, balances]
      properties:
        account: { $ref: '#/components/schemas/AccountKind' }
        label: { type: string, example: BSC Wallet }
        address: { type: string, nullable: true }
        chain:
          $ref: '#/components/schemas/Chain'
        total_value_usd: { $ref: '#/components/schemas/Decimal' }
        available_usd: { $ref: '#/components/schemas/Decimal' }
        margin_used_usd:
          type: string
          nullable: true
        balances:
          type: array
          items: { $ref: '#/components/schemas/TokenBalance' }

    TokenBalance:
      type: object
      required: [symbol, balance]
      properties:
        symbol: { type: string, example: USDC }
        balance: { $ref: '#/components/schemas/Decimal' }
        value_usd: { $ref: '#/components/schemas/Decimal' }
        decimals: { type: integer, example: 6 }
        chain: { $ref: '#/components/schemas/Chain' }

    HoldingGroup:
      type: object
      description: 资产页中一支股票下的所有产品持仓
      required: [stock, positions, total_value_usd]
      properties:
        stock: { $ref: '#/components/schemas/Stock' }
        total_value_usd: { $ref: '#/components/schemas/Decimal' }
        positions:
          type: array
          items: { $ref: '#/components/schemas/Position' }

    # --------------------------------------------------------------- Activity
    ActivityCategory:
      type: string
      enum: [orders, funds, signatures]

    ActivityType:
      type: string
      description: |
        订单类：`market` 市价单 · `limit` 限价单 · `tpsl` 止盈止损 · `close` 平仓 · `liquidation` 强平

        资金类：`deposit` 入金 · `external` 外部导入 · `bridge` 划转 · `withdraw` 提现 ·
        `claim` Claim 退款 · `funding` 资金费

        签名类：`approval` Token 授权 · `orderSign` 订单签名 · `bridgeSign` 划转签名
      enum:
        - market
        - limit
        - tpsl
        - close
        - liquidation
        - deposit
        - external
        - bridge
        - withdraw
        - claim
        - funding
        - approval
        - orderSign
        - bridgeSign

    ActivityStatus:
      type: string
      description: '`pending` 进行中 · `success` 已完成 · `failed` 失败 · `cancelled` 已取消'
      enum: [pending, success, failed, cancelled]

    Transfer:
      type: object
      description: App 账户与交易账户之间的资金划转记录
      required: [transfer_id, asset, amount, from_account, to_account, status, created_at]
      properties:
        transfer_id: { type: string }
        asset: { type: string, example: USDC }
        amount: { $ref: '#/components/schemas/Decimal' }
        from_account: { $ref: '#/components/schemas/AccountKind' }
        to_account: { $ref: '#/components/schemas/AccountKind' }
        status: { $ref: '#/components/schemas/ActivityStatus' }
        failure_reason: { type: string, nullable: true }
        tx_hash: { type: string, nullable: true }
        activity_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }

    Claim:
      type: object
      description: 划转失败后的资金退回记录
      required: [claim_id, transfer_id, asset, amount, status, created_at]
      properties:
        claim_id: { type: string }
        transfer_id: { type: string }
        asset: { type: string, example: USDC }
        amount: { $ref: '#/components/schemas/Decimal' }
        credited_to: { $ref: '#/components/schemas/AccountKind' }
        status: { $ref: '#/components/schemas/ActivityStatus' }
        failure_reason: { type: string, nullable: true }
        tx_hash: { type: string, nullable: true }
        activity_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }

    ActivityRecord:
      type: object
      required: [id, category, type, status, title, created_at]
      properties:
        id: { type: string, example: A-1030 }
        category: { $ref: '#/components/schemas/ActivityCategory' }
        type: { $ref: '#/components/schemas/ActivityType' }
        status: { $ref: '#/components/schemas/ActivityStatus' }
        title: { type: string, example: 买入 NVDA · Limit }
        amount:
          type: string
          description: 带单位的金额文案
          example: 450.00 USDC
        context:
          type: string
          description: 副标题，说明市场与当前状态
          example: bStocks · 等待成交
        symbol: { type: string, nullable: true }
        kind:
          $ref: '#/components/schemas/ProductKind'
        fields:
          type: array
          description: 展开后的键值对明细
          items: { $ref: '#/components/schemas/KeyValue' }
        related_id:
          type: string
          nullable: true
          description: 关联记录 id（如划转失败 ↔ Claim 退款）
        reference:
          type: object
          nullable: true
          description: 指向对应的业务实体，便于前端跳转
          properties:
            type:
              type: string
              enum: [order, position, transfer, claim, deposit, withdrawal]
            id: { type: string }
        chain:
          $ref: '#/components/schemas/Chain'
        tx_hash: { type: string, nullable: true }
        explorer:
          type: object
          nullable: true
          description: 区块链浏览器链接
          properties:
            name: { type: string, example: BscScan }
            url: { type: string, format: uri }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ActivityFilters:
      type: object
      properties:
        categories:
          type: array
          items:
            type: object
            properties:
              value: { $ref: '#/components/schemas/ActivityCategory' }
              label: { type: string, example: 订单 }
              types:
                type: array
                items:
                  type: object
                  properties:
                    value: { $ref: '#/components/schemas/ActivityType' }
                    label: { type: string, example: 限价单 }
        statuses:
          type: array
          items:
            type: object
            properties:
              value: { $ref: '#/components/schemas/ActivityStatus' }
              label: { type: string, example: 进行中 }

    # ----------------------------------------------------------------- System
    AppVersionInfo:
      type: object
      required: [platform, latest_version, min_supported_version]
      properties:
        platform: { $ref: '#/components/schemas/Platform' }
        latest_version:
          type: string
          description: 当前已发布的最新版本
          example: 1.1.0
        min_supported_version:
          type: string
          description: |
            仍被支持的最低版本。客户端版本低于此值时必须强制升级，
            不允许继续使用（用于服务端接口不兼容变更后的兜底）。
          example: 1.0.0
        release_notes: { type: string, nullable: true }
        store_url:
          type: string
          format: uri
          nullable: true
          description: App Store / 应用市场地址
        published_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time }

    AppVersionUpsert:
      type: object
      description: '`PUT /system/app-version/{platform}` 的请求体，整条覆盖'
      required: [latest_version, min_supported_version]
      properties:
        latest_version: { type: string, example: 1.1.0 }
        min_supported_version: { type: string, example: 1.0.0 }
        release_notes: { type: string, nullable: true }
        store_url: { type: string, format: uri, nullable: true }
        published_at: { type: string, format: date-time, nullable: true }

    Disclosures:
      type: object
      properties:
        always_on:
          type: object
          description: 24×7 交易说明
          properties:
            title: { type: string, example: 24×7 交易 }
            body: { type: string }
        sessions:
          type: array
          description: 各交易时段的说明
          items:
            type: object
            properties:
              session: { $ref: '#/components/schemas/SessionKind' }
              title: { type: string, example: 盘前 }
              body: { type: string }
        risk_notices:
          type: array
          items: { $ref: '#/components/schemas/KeyValue' }

    RealtimePriceUpdate:
      type: object
      required: [symbol, kind, price, change_24h_percent, updated_at]
      properties:
        symbol: { type: string, example: NVDA }
        kind: { $ref: '#/components/schemas/ProductKind' }
        price: { $ref: '#/components/schemas/Decimal' }
        change_24h_percent: { $ref: '#/components/schemas/Decimal' }
        updated_at: { type: string, format: date-time }

    RealtimeCandleUpdate:
      type: object
      required: [symbol, kind, interval, point]
      properties:
        symbol: { type: string, example: NVDA }
        kind: { $ref: '#/components/schemas/ProductKind' }
        interval: { type: string, enum: [1m, 5m, 15m, 1h, 4h, 1d] }
        point: { $ref: '#/components/schemas/CandlePoint' }

    RealtimeEventBase:
      type: object
      required: [event, event_id, data, emitted_at]
      properties:
        event_id:
          type: string
          description: 同时作为 SSE `id:` 字段发送的单调递增事件标识，用于断线续传和去重
        emitted_at: { type: string, format: date-time }
        event: { type: string }
        data: { type: object }

    RealtimeEvent:
      description: |
        SSE 事件载荷。`event_id` 等于 SSE 的 `id:` 值；客户端应持久化它，在重连时通过
        `Last-Event-ID` 传回。前台已消费的同一业务实体事件可用于抑制重复推送通知。
      oneOf:
        - $ref: '#/components/schemas/RealtimePriceEvent'
        - $ref: '#/components/schemas/RealtimeCandleEvent'
        - $ref: '#/components/schemas/RealtimeOrderEvent'
        - $ref: '#/components/schemas/RealtimePositionEvent'
        - $ref: '#/components/schemas/RealtimeTransferEvent'
        - $ref: '#/components/schemas/RealtimeClaimEvent'
        - $ref: '#/components/schemas/RealtimeDepositEvent'
        - $ref: '#/components/schemas/RealtimeWithdrawalEvent'
        - $ref: '#/components/schemas/RealtimeBalanceEvent'
        - $ref: '#/components/schemas/RealtimeActivityEvent'
        - $ref: '#/components/schemas/RealtimeSessionEvent'
        - $ref: '#/components/schemas/RealtimeResyncRequiredEvent'
      discriminator:
        propertyName: event
        mapping:
          price: '#/components/schemas/RealtimePriceEvent'
          candle: '#/components/schemas/RealtimeCandleEvent'
          order: '#/components/schemas/RealtimeOrderEvent'
          position: '#/components/schemas/RealtimePositionEvent'
          transfer: '#/components/schemas/RealtimeTransferEvent'
          claim: '#/components/schemas/RealtimeClaimEvent'
          deposit: '#/components/schemas/RealtimeDepositEvent'
          withdrawal: '#/components/schemas/RealtimeWithdrawalEvent'
          balance: '#/components/schemas/RealtimeBalanceEvent'
          activity: '#/components/schemas/RealtimeActivityEvent'
          session: '#/components/schemas/RealtimeSessionEvent'
          resync_required: '#/components/schemas/RealtimeResyncRequiredEvent'

    RealtimePriceEvent:
      allOf:
        - $ref: '#/components/schemas/RealtimeEventBase'
        - type: object
          properties:
            event: { type: string, enum: [price] }
            data: { $ref: '#/components/schemas/RealtimePriceUpdate' }
    RealtimeCandleEvent:
      allOf:
        - $ref: '#/components/schemas/RealtimeEventBase'
        - type: object
          properties:
            event: { type: string, enum: [candle] }
            data: { $ref: '#/components/schemas/RealtimeCandleUpdate' }
    RealtimeOrderEvent:
      allOf:
        - $ref: '#/components/schemas/RealtimeEventBase'
        - type: object
          properties:
            event: { type: string, enum: [order] }
            data: { $ref: '#/components/schemas/Order' }
    RealtimePositionEvent:
      allOf:
        - $ref: '#/components/schemas/RealtimeEventBase'
        - type: object
          properties:
            event: { type: string, enum: [position] }
            data: { $ref: '#/components/schemas/Position' }
    RealtimeTransferEvent:
      allOf:
        - $ref: '#/components/schemas/RealtimeEventBase'
        - type: object
          properties:
            event: { type: string, enum: [transfer] }
            data: { $ref: '#/components/schemas/Transfer' }
    RealtimeClaimEvent:
      allOf:
        - $ref: '#/components/schemas/RealtimeEventBase'
        - type: object
          properties:
            event: { type: string, enum: [claim] }
            data: { $ref: '#/components/schemas/Claim' }
    RealtimeDepositEvent:
      allOf:
        - $ref: '#/components/schemas/RealtimeEventBase'
        - type: object
          properties:
            event: { type: string, enum: [deposit] }
            data: { $ref: '#/components/schemas/Deposit' }
    RealtimeWithdrawalEvent:
      allOf:
        - $ref: '#/components/schemas/RealtimeEventBase'
        - type: object
          properties:
            event: { type: string, enum: [withdrawal] }
            data: { $ref: '#/components/schemas/Withdrawal' }
    RealtimeBalanceEvent:
      allOf:
        - $ref: '#/components/schemas/RealtimeEventBase'
        - type: object
          properties:
            event: { type: string, enum: [balance] }
            data: { $ref: '#/components/schemas/AccountBalance' }
    RealtimeActivityEvent:
      allOf:
        - $ref: '#/components/schemas/RealtimeEventBase'
        - type: object
          properties:
            event: { type: string, enum: [activity] }
            data: { $ref: '#/components/schemas/ActivityRecord' }
    RealtimeSessionEvent:
      allOf:
        - $ref: '#/components/schemas/RealtimeEventBase'
        - type: object
          properties:
            event: { type: string, enum: [session] }
            data: { $ref: '#/components/schemas/MarketSessionInfo' }
    RealtimeResyncRequiredEvent:
      allOf:
        - $ref: '#/components/schemas/RealtimeEventBase'
        - type: object
          properties:
            event: { type: string, enum: [resync_required] }
            data:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [event_retention_expired]
