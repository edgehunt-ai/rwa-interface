  /v1/portfolio/summary:
    get:
      tags:
        - Portfolio
      summary: 资产总览
      description: |
        已验证身份下的只读资产总览，不接受 wallet address、account ID 或 network
        作为资产所有权输入。总资产仅统计已成功估值且去重后的余额；普通钱包余额不会
        自动计入可交易金额。

        用户没有已验证钱包时返回 `200 empty`；部分余额来源或价格失败时返回
        `200 partial`，使用合格的 PostgreSQL last-good snapshot 时 freshness 为
        `stale`。只有所有必要 balance source 均不可用且没有合格 last-good 时才
        返回 `503`。禁止 Mock fallback，也不得把来源错误转换为零余额。
      operationId: getPortfolioSummary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioSummary"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/portfolio/assets:
    get:
      tags:
        - Portfolio
      summary: 分页列出真实用户资产
      description: |
        已验证身份下的只读资产列表，聚合 BSC、Arbitrum、Base、Ethereum 四条
        allowlisted EVM 网络以及 Hyperliquid Mainnet Info 的余额事实。USDC/USDT
        采用 `fixed_peg=1`，其他资产使用 DODOEX 价格；价格不可用时保留真实余额并
        返回未估值状态。

        该接口不接受 wallet address、account ID 或 network 作为资产所有权输入。
        用户没有已验证钱包时返回 `200 empty`；部分来源或价格失败时返回
        `200 partial`，使用合格的 PostgreSQL last-good snapshot 时 freshness 为
        `stale`。只有所有必要 balance source 均不可用且没有合格 last-good 时才
        返回 `503`。禁止 Mock fallback，也不得把来源错误转换为零余额。
      operationId: listPortfolioAssets
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioAssetPage"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/portfolio/accounts:
    get:
      tags:
        - Portfolio
      summary: 内部账本账户余额
      description: |
        仅返回 `internal_ledger` scope 下的三段式内部账户结构：

        * `app` —— App 可用余额（聚合账户，入金默认到账处）；
        * `bstocks` —— BSC Wallet，bStocks 现货交易账户；
        * `hip3` —— HIP-3 交易账户（Hyperliquid 保证金）。

        内部 ledger 可能是外部资产的业务镜像，不能与链上或 venue 余额双计。
        ledger 不可用时不得回退到 Mock，也不得把错误转换为零余额。
      operationId: listAccounts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioAccountPage"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "401":
