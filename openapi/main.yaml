        propertyName: chain
        mapping:
          BSC: "#/components/schemas/BscConfirmedDeposit"
          Arbitrum: "#/components/schemas/ArbitrumConfirmedDeposit"
    DepositBase:
      type: object
      additionalProperties: false
      required:
        - deposit_id
        - chain
        - chain_id
        - token
        - token_contract
        - token_decimals
        - amount
        - amount_raw
        - status
        - confirmations
        - confirmations_required
        - tx_hash
        - log_index
        - block_number
        - block_hash
        - sender
        - recipient
        - detected_at
        - confirmed_at
        - updated_at
      properties:
        deposit_id:
          type: string
        chain:
          type: string
        chain_id:
          type: integer
          format: int64
          minimum: 1
        token:
          type: string
          enum:
            - USDC
        token_contract:
          type: string
          pattern: "^0x[a-fA-F0-9]{40}$"
        token_decimals:
          type: integer
          minimum: 0
          maximum: 255
        amount:
          $ref: "#/components/schemas/Decimal"
        amount_raw:
          allOf:
            - $ref: "#/components/schemas/Decimal"
            - type: string
              pattern: "^[0-9]+$"
          description: ERC-20 Transfer log 中的精确原始整数金额。
        status:
          $ref: "#/components/schemas/DepositStatus"
        confirmations:
          type: integer
          minimum: 0
        confirmations_required:
          type: integer
          minimum: 1
        tx_hash:
          type: string
          pattern: "^0x[a-fA-F0-9]{64}$"
        log_index:
          type: integer
          format: int64
          minimum: 0
        block_number:
          type: integer
          format: int64
          minimum: 0
        block_hash:
          type: string
          pattern: "^0x[a-fA-F0-9]{64}$"
        sender:
          type: string
          pattern: "^0x[a-fA-F0-9]{40}$"
        recipient:
          type: string
          pattern: "^0x[a-fA-F0-9]{40}$"
        detected_at:
          type: string
          format: date-time
        confirmed_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BscConfirmedDeposit:
      allOf:
        - $ref: "#/components/schemas/DepositBase"
        - type: object
          properties:
            chain:
              type: string
              enum:
                - BSC
            chain_id:
              type: integer
              format: int64
              enum:
                - 56
            token_contract:
              type: string
              enum:
                - "0x8ac76a51cc950d9822d68b83fe1ad97b32cd580d"
            token_decimals:
              type: integer
              enum:
                - 18
    ArbitrumConfirmedDeposit:
      allOf:
        - $ref: "#/components/schemas/DepositBase"
        - type: object
          properties:
            chain:
              type: string
              enum:
                - Arbitrum
            chain_id:
              type: integer
              format: int64
              enum:
                - 42161
            token_contract:
              type: string
              enum:
                - "0xaf88d065e77c8cc2239327c5edb3a432268e5831"
            token_decimals:
              type: integer
              enum:
                - 6
    WithdrawalQuoteRequest:
      type: object
      additionalProperties: false
      required:
        - asset
        - chain
        - amount
        - address
      properties:
        asset:
          type: string
          enum:
            - USDC
        chain:
          $ref: "#/components/schemas/Chain"
        amount:
          $ref: "#/components/schemas/Decimal"
        address:
          type: string
    WithdrawalQuote:
      type: object
      required:
        - quote_id
        - amount
        - estimated_receive
        - total_fee
        - sufficient
      properties:
        quote_id:
          type: string
          description: 本次报价的标识，回传到 `CreateWithdrawalRequest.quote_id` 可锁定费率
        asset:
          type: string
          enum:
            - USDC
        chain:
          $ref: "#/components/schemas/Chain"
        amount:
          $ref: "#/components/schemas/Decimal"
        needs_convert:
          type: boolean
          description: 目标资产非 USDC 时需内部 Convert
        convert_route:
          type: string
          nullable: true
        transfer_route:
          type: string
          example: 聚合账户 → BSC Wallet
        needs_bridge:
          type: boolean
        bridge_route:
          type: string
          nullable: true
          example: BSC → Base
        convert_transfer_fee:
          $ref: "#/components/schemas/Decimal"
        bridge_fee:
          $ref: "#/components/schemas/Decimal"
        network_fee:
          $ref: "#/components/schemas/Decimal"
        total_fee:
          $ref: "#/components/schemas/Decimal"
        estimated_receive:
          $ref: "#/components/schemas/Decimal"
        estimated_time:
          type: string
          example: 约 2–5 分钟
        sufficient:
          type: boolean
          description: 提现金额是否足以覆盖费用
        details:
          type: array
          items:
            $ref: "#/components/schemas/KeyValue"
    CreateWithdrawalRequest:
      type: object
      additionalProperties: false
      required:
        - asset
        - chain
        - amount
        - address
        - authorization_id
        - quote_id
      properties:
        asset:
          type: string
          enum:
            - USDC
        chain:
          $ref: "#/components/schemas/Chain"
        amount:
          $ref: "#/components/schemas/Decimal"
        address:
          type: string
        authorization_id:
          type: string
          description: 已授权且尚未消费的钱包操作授权 ID
        memo:
          type: string
          nullable: true
        quote_id:
          type: string
        save_address:
          type: boolean
          default: false
        address_label:
          type: string
          nullable: true
    WithdrawalStatus:
      type: string
      enum:
        - pending_signature
        - processing
        - sent
        - completed
        - failed
        - ambiguous
        - manual_review
    Withdrawal:
      type: object
      required:
        - withdrawal_id
        - asset
        - chain
        - amount
        - status
      properties:
        withdrawal_id:
          type: string
        asset:
          type: string
          enum:
            - USDC
        chain:
          $ref: "#/components/schemas/Chain"
        amount:
          $ref: "#/components/schemas/Decimal"
        received_amount:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          type: string
          nullable: true
        total_fee:
          $ref: "#/components/schemas/Decimal"
        address:
          type: string
        memo:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/WithdrawalStatus"
        failure_reason:
          type: string
          nullable: true
        tx_hash:
          type: string
          nullable: true
        activity_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
    PortfolioDataStatus:
      type: string
      description: |
        聚合结果状态。`complete` 表示所有必要来源都有可用数据；`partial` 表示仍有真实
        结果但部分来源或估值不可用；`empty` 表示用户没有已验证钱包或没有资产。
      enum:
        - complete
        - partial
        - empty
    PortfolioFreshness:
      type: string
      description: |
        数据新鲜度。`live` 来自当前读取，`cached` 来自 fresh PostgreSQL snapshot，
        `stale` 来自仍在最大 stale 窗口内的 last-good snapshot。
      enum:
        - live
        - cached
        - stale
    PortfolioPriceSource:
      type: string
      description: |
        USD 价格来源。USDC/USDT 使用 `fixed_peg` 且价格固定为 1；其他资产使用
        `dodoex`；无法获得有效价格时为 `unavailable`，不得转成零。
      enum:
        - fixed_peg
        - dodoex
        - unavailable
    PortfolioSourceKind:
      type: string
      enum:
        - evm_rpc
        - hyperliquid_info
        - dodoex_price
        - fixed_peg
        - internal_ledger
    PortfolioAssetSourceKind:
      type: string
      description: 资产余额事实来源；估值来源由 `pricing_source` 单独表达。
      enum:
        - evm_rpc
        - hyperliquid_info
    PortfolioAssetNetwork:
      type: string
      description: Portfolio 资产及其来源允许返回的四条 EVM 网络与 Hyperliquid venue。
      enum:
        - BSC
        - Arbitrum
        - Base
        - Ethereum
        - Hyperliquid
    PortfolioSourceState:
      type: string
      enum:
        - available
        - unavailable
    PortfolioWarningCode:
      type: string
      enum:
        - evm_rpc_unavailable
        - hyperliquid_unavailable
        - price_unavailable
        - asset_unvalued
        - using_last_good
        - wallet_set_changed
        - internal_ledger_stale
        - internal_ledger_unreconciled
    PortfolioNoticeSeverity:
      type: string
      enum:
        - info
        - warning
        - error
    PortfolioNotice:
      type: object
      required:
        - code
        - severity
        - message
      properties:
        code:
          $ref: "#/components/schemas/PortfolioWarningCode"
        severity:
          $ref: "#/components/schemas/PortfolioNoticeSeverity"
        message:
          type: string
        user_action:
          type: string
          nullable: true
    PortfolioSourceSummary:
      type: object
      description: |
        单个只读余额、价格或内部账本来源的可用性与缓存新鲜度。`status=available`
        时 freshness 必须非 null；`status=unavailable` 且没有可用 last-good 时
        freshness 必须为 null；使用 last-good 时必须返回 `status=available`、
        `freshness=stale`，并附带 `using_last_good` warning。
      required:
        - source
        - status
        - freshness
      properties:
        source:
          $ref: "#/components/schemas/PortfolioSourceKind"
        network:
          allOf:
            - $ref: "#/components/schemas/PortfolioAssetNetwork"
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/PortfolioSourceState"
        freshness:
          allOf:
            - $ref: "#/components/schemas/PortfolioFreshness"
          type: string
          nullable: true
        observed_at:
          type: string
          format: date-time
          nullable: true
        warning_code:
          allOf:
            - $ref: "#/components/schemas/PortfolioWarningCode"
          type: string
          nullable: true
    PortfolioAsset:
      type: object
      description: |
        只读余额事实。EVM 资产的 network 仅使用 BSC、Arbitrum、Base、Ethereum
        四链 allowlist；venue 资产使用 Hyperliquid。任何标识都由服务端已验证的
        用户钱包集合或 venue account 派生，客户端不能覆盖所有权输入。
      required:
        - asset_id
        - source
        - network
        - native
        - symbol
        - decimals
        - balance_raw
        - balance
        - pricing_source
        - observed_at
        - freshness
        - warnings
      properties:
        asset_id:
          type: string
        source:
          $ref: "#/components/schemas/PortfolioAssetSourceKind"
        network:
          $ref: "#/components/schemas/PortfolioAssetNetwork"
        wallet_id:
          type: string
          nullable: true
        account_ref:
          type: string
          nullable: true
          description: Server-issued opaque account reference; clients cannot override it.
        contract_address:
          type: string
          nullable: true
        native:
          type: boolean
        symbol:
          type: string
        decimals:
          type: integer
          minimum: 0
          maximum: 255
        balance_raw:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          type: string
          pattern: ^[0-9]+$
          description: 无符号十进制整数形式的最小单位余额，不允许小数点或负号。
        balance:
          $ref: "#/components/schemas/Decimal"
        price_usd:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          type: string
          nullable: true
        pricing_source:
          allOf:
            - $ref: "#/components/schemas/PortfolioPriceSource"
          description: USD 估值来源；不代表余额或钱包所有权来源。
        value_usd:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          type: string
          nullable: true
        observed_at:
          type: string
          format: date-time
        block_number:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        block_hash:
          type: string
          nullable: true
        freshness:
          $ref: "#/components/schemas/PortfolioFreshness"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioWarningCode"
    PortfolioAssetPage:
      description: |
        分页资产余额及其已估值小计、未估值数量、来源状态和缓存时间。
        `valued_total_usd` 与 `unvalued_asset_count` 是同一 immutable snapshot 下对
        完整资产集合计算的全局聚合值，会在每一页重复；客户端不得跨页累加。
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required:
            - items
            - valued_total_usd
            - unvalued_asset_count
            - data_status
            - freshness
            - calculated_at
            - warnings
            - sources
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/PortfolioAsset"
            valued_total_usd:
              allOf:
                - $ref: "#/components/schemas/Decimal"
              description: |
                同一 immutable snapshot 范围内全部已成功估值资产的全局 subtotal，
                不代表全部资产价值；该值会在每页重复，客户端不得跨页累加。
            unvalued_asset_count:
              type: integer
              minimum: 0
              description: |
                同一 immutable snapshot 范围内完整资产集合的全局未估值数量；该值会
                在每页重复，客户端不得跨页累加。
            data_status:
              allOf:
                - $ref: "#/components/schemas/PortfolioDataStatus"
              description: 当 `unvalued_asset_count > 0` 时必须为 `partial`。
            freshness:
              $ref: "#/components/schemas/PortfolioFreshness"
            calculated_at:
              type: string
              format: date-time
            oldest_observation_at:
              type: string
              format: date-time
              nullable: true
            warnings:
              type: array
              items:
                $ref: "#/components/schemas/PortfolioNotice"
            sources:
              type: array
              items:
                $ref: "#/components/schemas/PortfolioSourceSummary"
    PortfolioSummary:
      type: object
      description: 去重后的只读资产总览；金额字段均使用 Decimal wire string。
      required:
        - total_value_usd
        - available_to_trade_usd
        - margin_in_use_usd
        - unvalued_asset_count
        - data_status
        - freshness
        - calculated_at
        - warnings
        - sources
      properties:
        total_value_usd:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          description: 所有已成功估值且去重资产的 subtotal；未估值资产不作为零计入。
        today_pnl_usd:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          type: string
          nullable: true
          description: 首版固定返回 null，不从不完整的缓存或历史估值推导。
        today_pnl_percent:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          type: string
          nullable: true
          description: 首版固定返回 null，不从不完整的缓存或历史估值推导。
        available_to_trade_usd:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          description: |
            可证明为 spendable/withdrawable 且没有 blocker 的余额子集；普通钱包余额
            不会自动等于 available to trade。
        margin_in_use_usd:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          description: Hyperliquid 报告的 margin used。
        unvalued_asset_count:
          type: integer
          minimum: 0
        data_status:
          allOf:
            - $ref: "#/components/schemas/PortfolioDataStatus"
          description: 当 `unvalued_asset_count > 0` 时必须为 `partial`。
        freshness:
          $ref: "#/components/schemas/PortfolioFreshness"
        calculated_at:
          type: string
          format: date-time
        oldest_observation_at:
          type: string
          format: date-time
          nullable: true
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioNotice"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioSourceSummary"
    PortfolioAccountPage:
      type: object
      description: |
        内部账本可能是链上或 venue 外部资产的业务镜像，不能与外部余额双计。
        只有已对账且没有 blocker 的余额才可以参与 available-to-trade 计算。
      required:
        - scope
        - items
        - reconciled
        - freshness
        - blockers
      properties:
        scope:
          type: string
          enum:
            - internal_ledger
        items:
          type: array
          items:
            $ref: "#/components/schemas/AccountBalance"
        reconciled:
          type: boolean
          description: 是否已与对应的外部资产来源完成对账。
        freshness:
          $ref: "#/components/schemas/PortfolioFreshness"
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioNotice"
    AccountBalance:
      type: object
      required:
        - account
        - balances
      properties:
        account:
          $ref: "#/components/schemas/AccountKind"
        label:
          type: string
          example: BSC Wallet
        address:
          type: string
          nullable: true
        chain:
          $ref: "#/components/schemas/Chain"
        total_value_usd:
          $ref: "#/components/schemas/Decimal"
        available_usd:
          $ref: "#/components/schemas/Decimal"
        margin_used_usd:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          type: string
          nullable: true
        balances:
          type: array
          items:
            $ref: "#/components/schemas/TokenBalance"
    TokenBalance:
      type: object
      required:
        - symbol
        - balance
      properties:
        symbol:
          type: string
          example: USDC
        balance:
          $ref: "#/components/schemas/Decimal"
        value_usd:
          $ref: "#/components/schemas/Decimal"
        decimals:
          type: integer
          example: 6
        chain:
          $ref: "#/components/schemas/Chain"
    HoldingGroup:
      type: object
      description: 资产页中一支股票下的所有产品持仓
      required:
        - stock
        - positions
        - total_value_usd
      properties:
        stock:
          $ref: "#/components/schemas/Stock"
        total_value_usd:
          $ref: "#/components/schemas/Decimal"
        positions:
          type: array
          items:
            $ref: "#/components/schemas/Position"
    PortfolioHoldingPage:
      description: |
        分页 HIP-3 position 展示。position notional 只用于展示，不再累加进 summary；
        total equity 采用 Hyperliquid account equity，避免对同一 venue 资产双计。
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required:
            - items
            - total_equity_usd
            - data_status
            - freshness
            - calculated_at
            - warnings
            - sources
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/HoldingGroup"
            total_equity_usd:
              allOf:
                - $ref: "#/components/schemas/Decimal"
              description: Hyperliquid account equity；不以 position notional 求和。
            data_status:
              $ref: "#/components/schemas/PortfolioDataStatus"
            freshness:
              $ref: "#/components/schemas/PortfolioFreshness"
            calculated_at:
              type: string
              format: date-time
            oldest_observation_at:
              type: string
              format: date-time
              nullable: true
            warnings:
              type: array
              items:
                $ref: "#/components/schemas/PortfolioNotice"
            sources:
              type: array
              items:
                $ref: "#/components/schemas/PortfolioSourceSummary"
    ActivityCategory:
      type: string
      enum:
        - orders
        - funds
    ActivityType:
      type: string
      description: |
        订单类：`market` 市价单 · `limit` 限价单 · `tpsl` 止盈止损 · `close` 平仓 · `liquidation` 强平

        资金类：`deposit` 入金 · `external` 外部导入 · `bridge` 划转 · `withdraw` 提现 ·
        `claim` Claim 退款 · `funding` 资金费。内部 Session、Intent、Preview、Authorization
        和签名请求不属于用户活动类型。
      enum:
        - market
        - limit
        - tpsl
        - close
        - liquidation
        - deposit
        - external
        - bridge
        - withdraw
        - claim
        - funding
    ActivityStatus:
      type: string
      description: "`pending` 进行中 · `success` 已完成 · `failed` 失败 · `cancelled` 已取消 · `manual_review` 证据冲突待人工复核"
      enum:
        - pending
        - success
        - failed
        - cancelled
        - manual_review
    Transfer:
      description: Legacy internal transfer or the new cross-chain funding transfer returned by the shared lookup and realtime surfaces.
      oneOf:
        - $ref: "#/components/schemas/LegacyTransfer"
        - $ref: "#/components/schemas/CrossChainFundingTransfer"
    LegacyTransfer:
      type: object
      additionalProperties: false
      description: Existing account-to-account transfer retained for Claim and historical activity compatibility.
      required:
        - transfer_id
        - asset
        - amount
        - from_account
        - to_account
        - status
        - created_at
      properties:
        transfer_id:
          type: string
        asset:
          type: string
          example: USDC
        amount:
          $ref: "#/components/schemas/Decimal"
        from_account:
          $ref: "#/components/schemas/AccountKind"
        to_account:
          $ref: "#/components/schemas/AccountKind"
        status:
          $ref: "#/components/schemas/LegacyTransferStatus"
        failure_reason:
          type: string
          nullable: true
        tx_hash:
          type: string
          nullable: true
        activity_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
    CrossChainFundingTransfer:
      type: object
      additionalProperties: false
      description: |
        一条已冻结单来源、单 Provider route 的跨链交易资金划转。
        主状态与 source/provider/target/refund observations 独立；只有源链 receipt、
        Provider terminal success 和目标端独立入账三项证据同时满足时才能 `completed`。
      allOf:
        - oneOf:
            - $ref: "#/components/schemas/CompletedFundingTransferState"
            - $ref: "#/components/schemas/NonCompletedFundingTransferState"
        - oneOf:
            - $ref: "#/components/schemas/BstockFundingTransferTarget"
            - $ref: "#/components/schemas/PerpFundingTransferTarget"
        - oneOf:
            - $ref: "#/components/schemas/LockedExecutableActionTransferState"
            - $ref: "#/components/schemas/NoExecutableActionTransferState"
      required:
        - transfer_id
        - plan_id
        - rail
        - amount
        - source
        - target
        - provider
        - status
        - source_execution_status
        - provider_status
        - provider_observation
        - target_credit_status
        - refund_status
        - recovery_status
        - source_transaction
        - target_credit
        - refund
        - next_action
        - failure_reason
        - ambiguous_reason
        - manual_review_reason
        - activity_id
        - route_locked_at
        - wallet_action_released_at
        - created_at
        - updated_at
        - completed_at
      properties:
        transfer_id:
          type: string
        plan_id:
          type: string
        rail:
          $ref: "#/components/schemas/ProductKind"
        amount:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          description: Frozen target shortfall covered by this Transfer.
        source:
          $ref: "#/components/schemas/FundingSourceBalanceSnapshot"
        target:
          $ref: "#/components/schemas/FundingTargetBalanceSnapshot"
        provider:
          $ref: "#/components/schemas/FundingProvider"
        status:
          $ref: "#/components/schemas/TransferStatus"
        source_execution_status:
          $ref: "#/components/schemas/TransferSourceExecutionStatus"
        provider_status:
          $ref: "#/components/schemas/TransferProviderStatus"
        provider_observation:
          type: object
          allOf:
            - $ref: "#/components/schemas/FundingProviderObservation"
          nullable: true
        target_credit_status:
          $ref: "#/components/schemas/TransferTargetCreditStatus"
        refund_status:
          $ref: "#/components/schemas/TransferRefundStatus"
        recovery_status:
          $ref: "#/components/schemas/TransferRecoveryStatus"
        source_transaction:
          type: object
          allOf:
            - $ref: "#/components/schemas/FundingSourceTransactionObservation"
          nullable: true
        target_credit:
          type: object
          allOf:
            - $ref: "#/components/schemas/FundingTargetCreditObservation"
          nullable: true
        refund:
          type: object
          allOf:
            - $ref: "#/components/schemas/FundingRefundObservation"
          nullable: true
        next_action:
          type: object
          allOf:
            - $ref: "#/components/schemas/FundingWalletAction"
          nullable: true
          description: |
            仅返回已冻结 route 中当前可执行的下一个动作；前序 receipt 未权威确认时为 null。
            服务端必须先在同一事务持久化 `route_locked_at` 和 `wallet_action_released_at`，
            才能返回含 `to/data/value` 的 next_action。
        failure_reason:
          type: string
          nullable: true
        ambiguous_reason:
          type: string
          nullable: true
        manual_review_reason:
          type: string
          nullable: true
        activity_id:
          type: string
          nullable: true
        route_locked_at:
          type: string
          format: date-time
          nullable: true
        wallet_action_released_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
    CompletedFundingTransferState:
      type: object
