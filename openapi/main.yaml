      properties:
        timezone:
          type: string
          example: America/New_York
        current:
          $ref: "#/components/schemas/SessionKind"
        current_label:
          type: string
          example: 开盘
        current_description:
          type: string
          example: 传统美股主要交易时段，价格发现和成交最活跃。
        next_session:
          $ref: "#/components/schemas/SessionKind"
        next_transition_at:
          type: string
          format: date-time
        seconds_until_transition:
          type: integer
          description: 距下一次时段切换的秒数，用于「距开盘 02:14:33」倒计时
        is_holiday:
          type: boolean
        holiday_name:
          type: string
          nullable: true
        segments:
          type: array
          items:
            $ref: "#/components/schemas/SessionSegment"
    ReferencePrice:
      type: object
      required:
        - symbol
        - price
        - session
        - as_of
      properties:
        symbol:
          type: string
        price:
          $ref: "#/components/schemas/Decimal"
        session:
          $ref: "#/components/schemas/SessionKind"
        as_of:
          type: string
          format: date-time
        is_stale:
          type: boolean
          description: 休市 / 隔夜时段为 `true`，前端应提示参考价停留在最近收盘水平
    OrderStatus:
      type: string
      description: 订单包含可恢复的 ambiguous 和需人工介入的 manual_review 状态；客户端通过订单 GET 与 SSE 跟踪后续变化。
      enum:
        - pending_signature
        - submitted
        - open
        - partially_filled
        - filled
        - cancelled
        - failed
        - ambiguous
        - manual_review
    TpSlSpec:
      type: object
      additionalProperties: false
      description: |
        止盈止损。市价单只需 `stop_loss_price`（UI 上显示为 Stop Loss）；限价单额外可设
        `stop_limit_price`，此时 `stop_loss_price` 对应 UI 上的 Stop Trigger Price。
        Long / buy：TP 需高于入场价，SL 需低于入场价；Short / sell 反之。
      properties:
        enabled:
          type: boolean
          default: false
        take_profit_price:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          type: string
          nullable: true
        stop_loss_price:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          type: string
          nullable: true
        stop_limit_price:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          type: string
          nullable: true
          description: 仅限价单
        take_profit_percent:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          type: string
          nullable: true
          description: 与价格互算，二者传其一即可
        stop_loss_percent:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          type: string
          nullable: true
        stop_limit_percent:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          type: string
          nullable: true
          description: 与 `stop_limit_price` 互算，二者传其一即可
    BstockOrderPreviewRequest:
      type: object
      additionalProperties: false
      description: |
        bStocks 现货订单。只接受 `buy` / `sell`：市价买入传 `amount`，市价卖出传
        `quantity`，限价买卖均须传 `limit_price` 和 `quantity`。
      required:
        - symbol
        - kind
        - side
        - type
      properties:
        symbol:
          type: string
          example: NVDA
        kind:
          type: string
          enum:
            - bstock
        side:
          type: string
          enum:
            - buy
            - sell
        type:
          $ref: "#/components/schemas/OrderType"
        amount:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          description: 市价买入时的 USDC 金额
        quantity:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          description: 市价卖出或限价单的基础资产数量
        limit_price:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          description: 限价单的 USDC 价格
        slippage_percent:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          type: string
          nullable: true
          description: 最大可接受滑点；超出则下单失败
        tp_sl:
          $ref: "#/components/schemas/TpSlSpec"
    PerpOrderPreviewRequest:
      type: object
      additionalProperties: false
      description: |
        HIP-3 永续订单。只接受 `long` / `short`；市价单以 `amount` 表示 USDC 名义价值，
        限价单须传 `limit_price` 和 `quantity`。杠杆、保证金模式和 `reduce_only` 仅适用于此类订单。
      required:
        - symbol
        - kind
        - side
        - type
      properties:
        symbol:
          type: string
          example: NVDA
        kind:
          type: string
          enum:
            - perp
        side:
          type: string
          enum:
            - long
            - short
        type:
          $ref: "#/components/schemas/OrderType"
        amount:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          description: 市价单的 USDC 名义价值
        quantity:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          description: 限价单的基础资产数量
        limit_price:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          description: 限价单的 USDC 价格
        leverage:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          description: Decimal string leverage; allowed range is 1 to 50.
        margin_mode:
          $ref: "#/components/schemas/MarginMode"
        reduce_only:
          type: boolean
          default: false
        slippage_percent:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          type: string
          nullable: true
          description: 最大可接受滑点；超出则下单失败
        tp_sl:
          $ref: "#/components/schemas/TpSlSpec"
    OrderPreviewRequest:
      description: 根据 `kind` 分派为 bStocks 现货或 HIP-3 永续订单。
      oneOf:
        - $ref: "#/components/schemas/BstockOrderPreviewRequest"
        - $ref: "#/components/schemas/PerpOrderPreviewRequest"
      discriminator:
        propertyName: kind
        mapping:
          bstock: "#/components/schemas/BstockOrderPreviewRequest"
          perp: "#/components/schemas/PerpOrderPreviewRequest"
    OrderPreview:
      description: 根据 `kind` 锁定结算网络：bstock => BSC/USDC，perp => Arbitrum/USDC。
      oneOf:
        - $ref: "#/components/schemas/BstockOrderPreview"
        - $ref: "#/components/schemas/PerpOrderPreview"
      discriminator:
        propertyName: kind
        mapping:
          bstock: "#/components/schemas/BstockOrderPreview"
          perp: "#/components/schemas/PerpOrderPreview"
    BstockOrderPreview:
      allOf:
        - type: object
          required:
            - kind
            - network
            - settlement_asset
          properties:
            kind:
              type: string
              enum:
                - bstock
            network:
              type: string
              enum:
                - BSC
            settlement_asset:
              type: string
              enum:
                - USDC
        - $ref: "#/components/schemas/OrderPreviewCommon"
    PerpOrderPreview:
      allOf:
        - type: object
          required:
            - kind
            - network
            - settlement_asset
          properties:
            kind:
              type: string
              enum:
                - perp
            network:
              type: string
              enum:
                - Arbitrum
            settlement_asset:
              type: string
              enum:
                - USDC
        - $ref: "#/components/schemas/OrderPreviewCommon"
    OrderPreviewCommon:
      type: object
      required:
        - preview_id
        - symbol
        - side
