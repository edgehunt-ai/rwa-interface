    RealtimeBalanceEvent:
      allOf:
        - $ref: "#/components/schemas/RealtimeEventBase"
        - type: object
          properties:
            event:
              type: string
              enum:
                - balance
            data:
              $ref: "#/components/schemas/AccountBalance"
    RealtimeActivityEvent:
      allOf:
        - $ref: "#/components/schemas/RealtimeEventBase"
        - type: object
          properties:
            event:
