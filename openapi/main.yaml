      tags:
        - System
      summary: 各平台最新版本
      description: |
        返回所有平台的版本信息。客户端拿自己的版本和对应平台的条目比较：

        * `current < min_supported_version` → 强制升级，阻断使用
        * `current < latest_version` → 提示有新版本，可跳过

        比较放在客户端而不是服务端，是为了避免「查版本」这一个接口出现
        「带参数算结果」和「不带参数列数据」两种模式。
      operationId: listAppVersions
      security: []
      parameters:
        - name: platform
          in: query
          description: 只取某个平台；不传则返回全部
          schema:
            $ref: "#/components/schemas/Platform"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - platforms
                properties:
                  platforms:
                    type: array
                    items:
                      $ref: "#/components/schemas/AppVersionInfo"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
