          example: NVIDIA
        kind:
          $ref: "#/components/schemas/ProductKind"
        product_type:
          type: string
          enum:
            - spot
            - contract
        label:
          type: string
          description: 展示名，`bStocks` 或 `HIP-3`
          example: bStocks
        price:
          $ref: "#/components/schemas/Decimal"
        change_24h_percent:
          allOf:
            - $ref: "#/components/schemas/Decimal"
