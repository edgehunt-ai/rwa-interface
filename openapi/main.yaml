        仅用于展示，不再累加进 summary；总资产采用 Hyperliquid account equity。
        该接口不接受 wallet address、account ID 或 network 作为资产所有权输入。

        用户没有已验证钱包时返回 `200 empty`；部分来源失败时返回 `200 partial`，
