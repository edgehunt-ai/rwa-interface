          description: Privy-produced signature for this exact server action
    LegacyTransferStatus:
      type: string
      enum:
        - pending
        - processing
        - claim_required
        - completed
        - failed
        - ambiguous
        - manual_review
    TransferStatus:
      type: string
      enum:
        - awaiting_authorization
        - awaiting_wallet
        - origin_submitted
        - origin_confirmed
        - filling
        - completed
        - refund_pending
        - refunded
        - failed
        - ambiguous
        - manual_review
