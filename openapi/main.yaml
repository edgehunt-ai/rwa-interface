        label:
          type: string
          description: 报价说明，如 `Last traded · NVDAB/USDC` 或 `Mark price · NVDA-PERP`
        price:
          $ref: "#/components/schemas/Decimal"
        change_24h:
          $ref: "#/components/schemas/Decimal"
        change_24h_percent:
          $ref: "#/components/schemas/Decimal"
        updated_at:
          type: string
          format: date-time
    MarketStats:
      type: object
      properties:
        high_24h:
          $ref: "#/components/schemas/Decimal"
        low_24h:
          $ref: "#/components/schemas/Decimal"
        turnover_24h_usd:
          $ref: "#/components/schemas/Decimal"
        volume_24h:
          $ref: "#/components/schemas/Decimal"
        volume_24h_unit:
          type: string
          example: NVDAB
        reference_label:
          type: string
          description: bStocks 为 `US Stock Reference`；HIP-3 为 `Spot / Reference Price`
        reference_price:
          $ref: "#/components/schemas/Decimal"
        relative_label:
          type: string
          description: bStocks 为 `Premium`；HIP-3 为 `Basis`
        relative_percent:
          $ref: "#/components/schemas/Decimal"
        spread_percent:
          $ref: "#/components/schemas/Decimal"
        best_bid:
          $ref: "#/components/schemas/Decimal"
        best_ask:
          $ref: "#/components/schemas/Decimal"
        funding_rate:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          type: string
          nullable: true
          description: 仅 HIP-3。正费率多头付空头，负费率反向。
        next_funding_at:
          type: string
          format: date-time
          nullable: true
        open_interest_usd:
          type: string
          nullable: true
          description: 仅 HIP-3
    OrderBook:
      type: object
      required:
        - bids
        - asks
      properties:
        bids:
          type: array
          items:
            $ref: "#/components/schemas/OrderBookLevel"
        asks:
          type: array
          items:
            $ref: "#/components/schemas/OrderBookLevel"
        updated_at:
          type: string
          format: date-time
    OrderBookLevel:
      type: object
      required:
        - price
        - size
      properties:
        price:
          $ref: "#/components/schemas/Decimal"
        size:
          $ref: "#/components/schemas/Decimal"
    AssetInfo:
      type: object
      description: 资产详情与权益
      required:
        - title
        - badge
        - description
        - rows
      properties:
        title:
          type: string
          example: BSC bStocks Token
        badge:
          type: string
          example: Spot · BSC
        description:
          type: string
          example: 获得 NVIDIA 底层证券的经济敞口；持有的是 BSC 钱包内的链上证券代币，不是 NVIDIA 股份的直接所有权。
        rows:
          type: array
          description: |
            权益明细。bStocks 典型项：发行方 / 资产支持 / 公司行动 / 股息再投资 /
            股息形式 / 投票权 / 资产结果。HIP-3 典型项：产品形态 / 底层权益 /
            保证金模式 / 股息再投资 / 资金费率 / 费率方向 / 资产结果。
          items:
            $ref: "#/components/schemas/KeyValue"
    CandleSeries:
      type: object
      required:
        - symbol
        - kind
        - range
        - points
      properties:
        symbol:
          type: string
        kind:
          $ref: "#/components/schemas/ProductKind"
        range:
          $ref: "#/components/schemas/ChartRange"
        interval:
          type: string
          example: 5m
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        change_absolute:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          description: 区间涨跌额，用于图表标题 `+$4.12 (+2.31%) 24h`
        change_percent:
          $ref: "#/components/schemas/Decimal"
        points:
          type: array
          description: 链上产品价格序列
          items:
            $ref: "#/components/schemas/CandlePoint"
        reference_points:
          type: array
          description: |
            美股参考价序列。仅在美股有报价的时段有值 —— 隔夜与休市时段为空洞，
            前端应断开连线或画虚线。
          items:
            $ref: "#/components/schemas/CandlePoint"
        sessions:
          type: array
          description: 该区间内的时段分段，用于绘制底部色带
          items:
            $ref: "#/components/schemas/SessionSegment"
    CandlePoint:
      type: object
      required:
        - t
        - c
      properties:
        t:
          type: string
          format: date-time
          description: 该点时间
        o:
          $ref: "#/components/schemas/Decimal"
        h:
          $ref: "#/components/schemas/Decimal"
        l:
          $ref: "#/components/schemas/Decimal"
        c:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          description: 收盘 / 该点价格
        v:
          $ref: "#/components/schemas/Decimal"
    SessionSegment:
      type: object
      required:
        - session
        - start
        - end
      properties:
        session:
          $ref: "#/components/schemas/SessionKind"
        label:
          type: string
          example: 开盘
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
    MarketSessionInfo:
      type: object
      required:
        - current
