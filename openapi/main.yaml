      summary: 实时事件流（SSE）
      description: |
        Server-Sent Events。推送价格、订单状态、持仓与余额变化，
        替代前端轮询。每条事件同时以 SSE 的 `id:` 字段和载荷的 `event_id` 给出可续传
        标识；断线重连时客户端带上最近收到的 `Last-Event-ID`，服务端补发其后的事件。
