          pattern: "^0x[a-fA-F0-9]{40}$"
        data:
          type: string
          pattern: "^0x[a-fA-F0-9]*$"
        value:
          type: string
          pattern: "^0x[a-fA-F0-9]+$"
          description: Frozen EVM transaction value encoded as a hexadecimal quantity, not a display amount.
        payload_hash:
          type: string
          pattern: "^[a-fA-F0-9]{64}$"
        valid_until:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/TransferActionStatus"
        token_contract:
          type: string
          pattern: "^0x[a-fA-F0-9]{40}$"
        spender:
          type: string
          pattern: "^0x[a-fA-F0-9]{40}$"
        approval_amount:
          $ref: "#/components/schemas/Decimal"
    OriginTransactionAction:
      type: object
      additionalProperties: false
      required:
        - action_id
        - ordinal
        - kind
        - chain_id
        - from
        - to
        - data
        - value
        - payload_hash
        - valid_until
        - status
        - recipient
        - refund_address
      properties:
        action_id:
          type: string
        ordinal:
          type: integer
          minimum: 1
        kind:
          type: string
          enum:
            - origin_transaction
        chain_id:
          type: integer
          format: int64
          minimum: 1
        from:
          type: string
          pattern: "^0x[a-fA-F0-9]{40}$"
        to:
          type: string
          pattern: "^0x[a-fA-F0-9]{40}$"
        data:
          type: string
          pattern: "^0x[a-fA-F0-9]*$"
        value:
          type: string
          pattern: "^0x[a-fA-F0-9]+$"
          description: Frozen EVM transaction value encoded as a hexadecimal quantity, not a display amount.
        payload_hash:
          type: string
          pattern: "^[a-fA-F0-9]{64}$"
        valid_until:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/TransferActionStatus"
        recipient:
          type: string
        refund_address:
          type: string
          pattern: "^0x[a-fA-F0-9]{40}$"
    FundingWalletAction:
      description: |
        A server-frozen action. Provider signature steps, permit, gasless, calls arrays, multicall and
        embedded destination actions are not representable by this contract.
      oneOf:
        - $ref: "#/components/schemas/Erc20ApprovalAction"
        - $ref: "#/components/schemas/OriginTransactionAction"
      discriminator:
        propertyName: kind
        mapping:
          erc20_approval: "#/components/schemas/Erc20ApprovalAction"
          origin_transaction: "#/components/schemas/OriginTransactionAction"
    ReadyErc20ApprovalAction:
      allOf:
        - $ref: "#/components/schemas/Erc20ApprovalAction"
        - type: object
          properties:
            status:
              type: string
              enum: [ready]
    ReadyOriginTransactionAction:
      allOf:
        - $ref: "#/components/schemas/OriginTransactionAction"
        - type: object
          properties:
            status:
              type: string
              enum: [ready]
    ReadyFundingWalletAction:
      oneOf:
        - $ref: "#/components/schemas/ReadyErc20ApprovalAction"
        - $ref: "#/components/schemas/ReadyOriginTransactionAction"
      discriminator:
        propertyName: kind
        mapping:
          erc20_approval: "#/components/schemas/ReadyErc20ApprovalAction"
          origin_transaction: "#/components/schemas/ReadyOriginTransactionAction"
    FundingWalletActionSummary:
      type: object
      additionalProperties: false
      description: Frozen action metadata without executable to/data/value; executable payload is released only as Transfer.next_action after route lock.
      required:
        - action_id
        - ordinal
        - kind
        - payload_hash
        - valid_until
        - status
      properties:
        action_id:
          type: string
        ordinal:
          type: integer
          minimum: 1
        kind:
          type: string
          enum:
            - erc20_approval
            - origin_transaction
        payload_hash:
          type: string
          pattern: "^[a-fA-F0-9]{64}$"
        valid_until:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/TransferActionStatus"
    FundingPlanRequest:
      type: object
      additionalProperties: false
      required:
        - trade_preview_id
        - mode
      properties:
        trade_preview_id:
          type: string
          description: Immutable trade preview from which purpose, target identity and required target amount are derived.
        mode:
          $ref: "#/components/schemas/FundingPlanMode"
    BstockFundingTargetAsset:
      allOf:
        - $ref: "#/components/schemas/FundingAssetIdentity"
        - type: object
          properties:
            asset_id:
              type: string
              enum: ["eip155:56/erc20:0x55d398326f99059ff775485246999027b3197955"]
            namespace:
              type: string
              enum: [eip155]
            network:
              type: string
              enum: [BSC]
            chain_id:
              type: integer
              format: int64
              enum: [56]
            token:
              type: string
              enum: [USDT]
            token_contract:
              type: string
              enum: ["0x55d398326f99059ff775485246999027b3197955"]
            token_decimals:
              type: integer
              enum: [18]
            provenance:
              type: string
              enum: [binance_peg]
    PerpFundingTargetAsset:
      allOf:
        - $ref: "#/components/schemas/FundingAssetIdentity"
        - type: object
          properties:
            asset_id:
              type: string
              enum: ["hyperliquid:1337/perps:USDC-PERPS"]
            namespace:
              type: string
              enum: [hyperliquid]
            network:
              type: string
              enum: [Hyperliquid]
            chain_id:
              type: integer
              format: int64
              enum: [1337]
            token:
              type: string
              enum: [USDC-PERPS]
            token_contract:
              type: string
              enum: ["0x2100000000000000000000000000000000000000"]
            token_decimals:
              type: integer
              enum: [8]
            provenance:
              type: string
              enum: [hyperliquid_perps]
    BstockFundingTargetBalanceSnapshot:
      allOf:
        - $ref: "#/components/schemas/FundingTargetBalanceSnapshot"
        - type: object
          properties:
            account:
              type: string
              enum: [bstocks]
            asset:
              $ref: "#/components/schemas/BstockFundingTargetAsset"
            source:
              type: string
              enum: [bsc_rpc]
    PerpFundingTargetBalanceSnapshot:
      allOf:
        - $ref: "#/components/schemas/FundingTargetBalanceSnapshot"
        - type: object
          properties:
            account:
              type: string
              enum: [hip3]
            asset:
              $ref: "#/components/schemas/PerpFundingTargetAsset"
            source:
              type: string
              enum: [hyperliquid_info]
    FundingPlan:
      description: 根据 `rail` 锁定目标结算身份：bstock => BSC/USDT，perp => Hyperliquid Perps/USDC。
      oneOf:
        - $ref: "#/components/schemas/BstockFundingPlan"
        - $ref: "#/components/schemas/PerpFundingPlan"
      discriminator:
        propertyName: rail
        mapping:
          bstock: "#/components/schemas/BstockFundingPlan"
          perp: "#/components/schemas/PerpFundingPlan"
    FundingPlanBase:
      type: object
      description: |
        Stable response shape. `already_funded` and `blocked` plans return null for source/selected_route/expires_at,
        an empty wallet_actions array, and a nullable blocker appropriate to the status.
      allOf:
        - oneOf:
            - $ref: "#/components/schemas/ReadyFundingPlanState"
            - $ref: "#/components/schemas/AlreadyFundedFundingPlanState"
            - $ref: "#/components/schemas/BlockedFundingPlanState"
            - $ref: "#/components/schemas/TerminalFundingPlanState"
      required:
        - plan_id
        - trade_preview_id
        - mode
        - required_target_amount
        - target_snapshot
        - shortfall
        - status
        - blocker
        - source
        - selected_route
        - wallet_actions
        - created_at
        - expires_at
      properties:
        plan_id:
          type: string
        trade_preview_id:
          type: string
        mode:
          $ref: "#/components/schemas/FundingPlanMode"
        required_target_amount:
          $ref: "#/components/schemas/Decimal"
        target_snapshot:
          $ref: "#/components/schemas/FundingTargetBalanceSnapshot"
        shortfall:
          $ref: "#/components/schemas/Decimal"
        status:
          $ref: "#/components/schemas/FundingPlanStatus"
        blocker:
          type: string
          allOf:
            - $ref: "#/components/schemas/FundingPlanBlocker"
          nullable: true
        source:
          type: object
          allOf:
            - $ref: "#/components/schemas/FundingSourceBalanceSnapshot"
          nullable: true
        selected_route:
          type: object
          allOf:
            - $ref: "#/components/schemas/FundingRouteQuote"
          nullable: true
        wallet_actions:
          type: array
          items:
            $ref: "#/components/schemas/FundingWalletActionSummary"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
    ReadyFundingPlanState:
      type: object
      required:
        - status
        - blocker
        - source
        - selected_route
        - wallet_actions
        - expires_at
      properties:
        status:
          type: string
          enum: [ready]
        blocker:
          type: string
          nullable: true
          enum: [null]
        source:
          $ref: "#/components/schemas/FundingSourceBalanceSnapshot"
        selected_route:
          $ref: "#/components/schemas/FundingRouteQuote"
        wallet_actions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/FundingWalletActionSummary"
        expires_at:
          type: string
          format: date-time
    AlreadyFundedFundingPlanState:
      type: object
      required:
        - status
        - blocker
        - source
        - selected_route
        - wallet_actions
        - expires_at
        - shortfall
      properties:
        status:
          type: string
          enum: [already_funded]
        blocker:
          type: string
          nullable: true
          enum: [null]
        source:
          type: object
          nullable: true
          enum: [null]
        selected_route:
          type: object
          nullable: true
          enum: [null]
        wallet_actions:
          type: array
          maxItems: 0
          items:
            $ref: "#/components/schemas/FundingWalletActionSummary"
        expires_at:
          type: string
          nullable: true
          enum: [null]
        shortfall:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          pattern: "^0(?:\\.0+)?$"
    BlockedFundingPlanState:
      type: object
      required:
        - status
