            - $ref: "#/components/schemas/Decimal"
          description: Decimal amount without a unit suffix.
        context:
          type: string
          description: 副标题，说明市场与当前状态
          example: bStocks · 等待成交
        symbol:
          type: string
          nullable: true
        kind:
          $ref: "#/components/schemas/ProductKind"
        fields:
          type: array
          description: 展开后的键值对明细
          items:
            $ref: "#/components/schemas/KeyValue"
        related_id:
          type: string
          nullable: true
          description: 关联记录 id（如划转失败 ↔ Claim 退款）
        reference:
          type: object
          nullable: true
          description: 指向对应的业务实体，便于前端跳转
          properties:
            type:
              type: string
              enum:
                - order
                - position
                - transfer
                - claim
                - deposit
                - withdrawal
            id:
              type: string
        chain:
          $ref: "#/components/schemas/Chain"
        tx_hash:
          type: string
          nullable: true
        explorer:
          type: object
          nullable: true
          description: 区块链浏览器链接
          properties:
            name:
              type: string
              example: BscScan
            url:
              type: string
              format: uri
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        asset:
          type: string
          nullable: true
          description: Unit for amount, for example USDC or NVDAB.
    AppVersionInfo:
      type: object
      required:
        - platform
        - latest_version
        - min_supported_version
      properties:
        platform:
          $ref: "#/components/schemas/Platform"
        latest_version:
          type: string
          description: 当前已发布的最新版本
          example: 1.1.0
        min_supported_version:
          type: string
          description: |
            仍被支持的最低版本。客户端版本低于此值时必须强制升级，
            不允许继续使用（用于服务端接口不兼容变更后的兜底）。
          example: 1.0.0
        release_notes:
          type: string
          nullable: true
        store_url:
          type: string
          format: uri
          nullable: true
          description: App Store / 应用市场地址
        published_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
    Disclosures:
      type: object
      properties:
        always_on:
          type: object
          description: 24×7 交易说明
          properties:
            title:
              type: string
              example: 24×7 交易
            body:
              type: string
        sessions:
          type: array
          description: 各交易时段的说明
          items:
            type: object
            properties:
              session:
                $ref: "#/components/schemas/SessionKind"
              title:
                type: string
                example: 盘前
              body:
                type: string
        risk_notices:
          type: array
          items:
            $ref: "#/components/schemas/KeyValue"
    RealtimePriceUpdate:
      type: object
      required:
        - symbol
        - kind
        - price
        - change_24h_percent
        - updated_at
      properties:
        symbol:
          type: string
          example: NVDA
        kind:
          $ref: "#/components/schemas/ProductKind"
        price:
          $ref: "#/components/schemas/Decimal"
        change_24h_percent:
          $ref: "#/components/schemas/Decimal"
        updated_at:
          type: string
          format: date-time
    RealtimeCandleUpdate:
      type: object
      required:
        - symbol
        - kind
        - interval
        - point
      properties:
        symbol:
          type: string
          example: NVDA
        kind:
          $ref: "#/components/schemas/ProductKind"
        interval:
          type: string
          enum:
            - 1m
            - 5m
            - 15m
            - 1h
            - 4h
            - 1d
        point:
          $ref: "#/components/schemas/CandlePoint"
    RealtimeEventBase:
      type: object
      required:
        - event
        - event_id
        - data
        - emitted_at
      properties:
        event_id:
          type: string
          description: 同时作为 SSE `id:` 字段发送的单调递增事件标识，用于断线续传和去重
        emitted_at:
          type: string
          format: date-time
        event:
          type: string
        data:
          type: object
    RealtimeEvent:
      description: |
        SSE 事件载荷。`event_id` 等于 SSE 的 `id:` 值；客户端应持久化它，在重连时通过
        `Last-Event-ID` 传回。前台已消费的同一业务实体事件可用于抑制重复推送通知。
      oneOf:
        - $ref: "#/components/schemas/RealtimePriceEvent"
        - $ref: "#/components/schemas/RealtimeCandleEvent"
        - $ref: "#/components/schemas/RealtimeOrderEvent"
        - $ref: "#/components/schemas/RealtimePositionEvent"
        - $ref: "#/components/schemas/RealtimeTransferEvent"
        - $ref: "#/components/schemas/RealtimeClaimEvent"
        - $ref: "#/components/schemas/RealtimeDepositEvent"
        - $ref: "#/components/schemas/RealtimeWithdrawalEvent"
        - $ref: "#/components/schemas/RealtimeBalanceEvent"
        - $ref: "#/components/schemas/RealtimeActivityEvent"
        - $ref: "#/components/schemas/RealtimeSessionEvent"
        - $ref: "#/components/schemas/RealtimeResyncRequiredEvent"
      discriminator:
        propertyName: event
        mapping:
          price: "#/components/schemas/RealtimePriceEvent"
          candle: "#/components/schemas/RealtimeCandleEvent"
          order: "#/components/schemas/RealtimeOrderEvent"
          position: "#/components/schemas/RealtimePositionEvent"
          transfer: "#/components/schemas/RealtimeTransferEvent"
          claim: "#/components/schemas/RealtimeClaimEvent"
          deposit: "#/components/schemas/RealtimeDepositEvent"
          withdrawal: "#/components/schemas/RealtimeWithdrawalEvent"
          balance: "#/components/schemas/RealtimeBalanceEvent"
          activity: "#/components/schemas/RealtimeActivityEvent"
          session: "#/components/schemas/RealtimeSessionEvent"
          resync_required: "#/components/schemas/RealtimeResyncRequiredEvent"
    RealtimePriceEvent:
      allOf:
        - $ref: "#/components/schemas/RealtimeEventBase"
        - type: object
          properties:
            event:
              type: string
              enum:
                - price
            data:
              $ref: "#/components/schemas/RealtimePriceUpdate"
    RealtimeCandleEvent:
      allOf:
        - $ref: "#/components/schemas/RealtimeEventBase"
        - type: object
          properties:
            event:
              type: string
              enum:
                - candle
            data:
              $ref: "#/components/schemas/RealtimeCandleUpdate"
    RealtimeOrderEvent:
      allOf:
        - $ref: "#/components/schemas/RealtimeEventBase"
        - type: object
          properties:
            event:
              type: string
              enum:
                - order
            data:
              $ref: "#/components/schemas/Order"
    RealtimePositionEvent:
      allOf:
        - $ref: "#/components/schemas/RealtimeEventBase"
        - type: object
          properties:
