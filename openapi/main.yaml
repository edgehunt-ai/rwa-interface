          type: string
          example: NVDA
        name:
          type: string
          example: NVIDIA
        logo_url:
          type: string
          format: uri
          nullable: true
        logo_text:
          type: string
          description: 无图时的占位字母
          example: NV
        reference_price:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          description: 美股最近参考价
        reference_session:
          $ref: "#/components/schemas/SessionKind"
        reference_at:
          type: string
          format: date-time
    StockGroup:
      type: object
      description: 市场页「股票」Tab 的一张卡片
      required:
