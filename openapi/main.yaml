        badge:
          type: string
          description: 角标，如 `Spot · BSC` / `Isolated margin`
        description:
          type: string
          description: 产品说明长文案
        quote:
          $ref: "#/components/schemas/Quote"
        stats:
          $ref: "#/components/schemas/MarketStats"
        asset_info:
          $ref: "#/components/schemas/AssetInfo"
        trading_hours:
