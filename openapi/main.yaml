          type: string
          enum:
            - USDC
        status:
          type: string
          enum:
            - pending_signature
            - completed
            - expired
            - failed
        message:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    WalletActionCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - signature
      properties:
        signature:
          type: string
          description: Privy-produced signature for this exact server action
    TransferStatus:
      type: string
      enum:
        - pending
        - processing
        - claim_required
        - completed
        - failed
        - ambiguous
        - manual_review
