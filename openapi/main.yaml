        spread_vs_reference_percent:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          description: 相对美股参考价的价差百分比
        volume_24h:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          description: 24h 成交量（以基础资产计价）
        volume_24h_unit:
          type: string
          example: NVDAB
        turnover_24h_usd:
          $ref: "#/components/schemas/Decimal"
        hot_rank:
          type: integer
          nullable: true
        is_favorite:
          type: boolean
          default: false
    ProductDetail:
      type: object
      required:
        - symbol
        - kind
        - quote
