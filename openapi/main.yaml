          nullable: true
    Hip3ChallengeCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - signature
      properties:
        signature:
          type: string
          description: Privy-produced signature over the server challenge
    Hip3Challenge:
      type: object
      required:
        - challenge_id
        - network
        - status
        - message
        - created_at
        - expires_at
      properties:
        challenge_id:
          type: string
        network:
          type: string
          enum:
