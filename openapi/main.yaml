              type: string
              enum:
                - claim
            data:
              $ref: "#/components/schemas/Claim"
    RealtimeDepositEvent:
      allOf:
        - $ref: "#/components/schemas/RealtimeEventBase"
        - type: object
          properties:
            event:
              type: string
              enum:
                - deposit
            data:
              $ref: "#/components/schemas/Deposit"
    RealtimeWithdrawalEvent:
      allOf:
        - $ref: "#/components/schemas/RealtimeEventBase"
        - type: object
          properties:
