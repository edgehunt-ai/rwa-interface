components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Privy
      description: Privy access token issued to the signed-in client. The API does not issue a second access token.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Client-generated unique command key. A replay returns the first resource; a different request with the same key returns 409.
      schema:
        type: string
        format: uuid
      required: true
    Cursor:
      name: cursor
      in: query
      description: 上一页返回的 `next_cursor`
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    LastEventId:
      name: Last-Event-ID
      in: header
      description: |
        SSE 断线重连时传入最后成功处理的 `event_id`。服务端应从该事件之后补发；
        若保留窗口已过期，则发送一条 `resync_required` 事件并由客户端重新拉取快照。
      schema:
        type: string
    Symbol:
      name: symbol
      in: path
      required: true
      description: 股票代码
      schema:
        type: string
        example: NVDA
    ProductKind:
      name: kind
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ProductKind"
    OrderId:
      name: order_id
      in: path
      required: true
      schema:
        type: string
    PositionId:
      name: position_id
      in: path
      required: true
      schema:
        type: string
    DeviceId:
      name: device_id
      in: path
      required: true
      schema:
        type: string
    WalletId:
      name: wallet_id
      in: path
      required: true
      schema:
        type: string
    FundingPlanId:
      name: plan_id
      in: path
      required: true
      schema:
        type: string
    DepositId:
      name: deposit_id
      in: path
      required: true
      schema:
        type: string
    TransferId:
      name: transfer_id
      in: path
      required: true
      schema:
        type: string
    WithdrawalId:
      name: withdrawal_id
      in: path
      required: true
      schema:
        type: string
    ChallengeId:
      name: challenge_id
      in: path
      required: true
      schema:
        type: string
    StepId:
      name: step_id
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Idempotency, stale resource, or lifecycle conflict
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, invalid, or expired Privy bearer token
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated user cannot perform this action
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: Business rule rejected the request
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: A required service is unavailable
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Decimal:
      type: string
      description: 十进制字符串，避免浮点误差
      pattern: ^-?[0-9]+(\.[0-9]+)?$
      example: "183.25"
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - retryable
        - user_action
        - details
        - request_id
      properties:
        code:
          type: string
          description: Stable machine-readable error code
          example: insufficient_funds
        message:
          type: string
          description: Localized user-facing message
        retryable:
          type: boolean
          description: Whether retrying the same request can succeed
        user_action:
          type: string
          nullable: true
          description: Stable client action hint, or null
        details:
          type: object
          additionalProperties: true
          nullable: true
        request_id:
          type: string
          description: Matches the X-Request-ID response header
    Page:
      type: object
      required:
        - next_cursor
        - has_more
      properties:
        next_cursor:
          type: string
          nullable: true
          description: 为 `null` 表示没有更多数据
        has_more:
          type: boolean
    ProductKind:
      type: string
      description: |
        产品类型：
        * `bstock` —— BSC bStocks Token（现货）
        * `perp` —— HIP-3 Perpetual（永续合约）
      enum:
        - bstock
        - perp
      example: bstock
    ProductType:
      type: string
      description: 首页 / 市场页一级筛选
      enum:
        - all
        - spot
        - contract
      default: all
    MarketProductGroup:
      type: string
      description: |
        市场产品列表分组。`favorites` 仅表示当前登录用户的自选产品，其他值为全市场排行。
      enum:
        - hot
        - gainers
        - losers
        - volume
        - favorites
      default: hot
    Chain:
      type: string
      enum:
        - BSC
        - Arbitrum
        - Base
        - Ethereum
        - Hyperliquid
        - Polygon
        - Solana
    AccountKind:
      type: string
      description: |
        * `app` —— App 可用余额（聚合账户）
        * `bstocks` —— BSC Wallet，bStocks 交易账户
        * `hip3` —— HIP-3 交易账户
      enum:
        - app
        - bstocks
        - hip3
    OrderSide:
      type: string
      description: 现货用 `buy` / `sell`；合约用 `long` / `short`
      enum:
        - buy
        - sell
        - long
        - short
    OrderType:
      type: string
      enum:
        - market
        - limit
    MarginMode:
      type: string
      enum:
        - isolated
        - cross
    ChartRange:
      type: string
      enum:
        - 15m
        - 4h
        - 24h
        - 1w
      default: 24h
    SessionKind:
      type: string
      description: 美股交易时段：盘前 / 开盘 / 盘后 / 隔夜 / 周末休市 / 节假日休市
      enum:
        - premarket
        - regular
        - after
        - overnight
        - weekend
        - holiday
    PrivyClientConfig:
      type: object
      required:
        - privy_app_id
        - login_methods
      properties:
        privy_app_id:
          type: string
          example: clxxxxxxxxxxxxxxxxxxx
        privy_client_id:
          type: string
          nullable: true
          description: Privy 移动端 client ID（iOS / Android 分别配置时使用）
        login_methods:
          type: array
          items:
            type: string
            enum:
              - email
              - apple
              - google
        embedded_wallet:
          type: object
          description: Embedded Wallet 创建策略
          properties:
            create_on_login:
              type: string
              enum:
                - users-without-wallets
                - all-users
                - off
            chains:
              type: array
              items:
                $ref: "#/components/schemas/Chain"
        terms_url:
          type: string
          format: uri
        privacy_url:
          type: string
          format: uri
    SessionRequest:
      type: object
      additionalProperties: false
      properties:
        language:
          type: string
          nullable: true
          description: Preferred BCP 47 language tag. Existing users update their preference when supplied.
          example: zh-CN
        device:
          $ref: "#/components/schemas/DeviceInfo"
    Platform:
      type: string
      description: |
        客户端平台。当前为 `ios` / `android`，**后续可能新增**（如 `harmony`、`web`）。

        这里刻意用开放字符串而不是枚举：服务端新增平台时，老客户端反序列化
        不会因为遇到未知枚举值而崩溃。客户端只需认得自己那个值。
      example: ios
    DeviceInfo:
      type: object
      additionalProperties: false
      description: |
        登录时一并提交的设备信息，等价于调用一次 `POST /v1/me/devices`。
        令牌轮换必须走 `POST /v1/me/devices`。
      properties:
        device_id:
          type: string
          description: 客户端生成并持久化的设备标识，用于 upsert
        platform:
          $ref: "#/components/schemas/Platform"
        app_version:
          type: string
          example: 1.0.0
        push_token:
          type: string
          nullable: true
    DeviceRegisterRequest:
      type: object
      additionalProperties: false
      required:
        - device_id
        - platform
        - push_token
      properties:
        device_id:
          type: string
        platform:
          $ref: "#/components/schemas/Platform"
        app_version:
          type: string
          nullable: true
          example: 1.2.0
          description: |
            当前安装的版本号，可选。**用途是推送内容分流，不是设备统计**——
            比如老版本不支持富通知（图片 / 按钮）或某种深链格式时，
            后端据此回退成纯文本推送，避免老版本收到解析不了的 payload。

            与令牌一样会过期：客户端每次上报令牌时应一并带上当前版本号，
            不需要单独维护更新时机。
        push_token:
          type: string
          description: APNs / FCM 推送令牌
        push_provider:
          type: string
          enum:
            - apns
            - fcm
          description: 不传则由后端按 `platform` 推断
    Device:
      type: object
      required:
        - device_id
        - platform
      properties:
        device_id:
          type: string
        platform:
          $ref: "#/components/schemas/Platform"
        app_version:
          type: string
          nullable: true
          description: 用于推送内容分流；客户端未上报过时为 null
        push_provider:
          type: string
          enum:
            - apns
            - fcm
          nullable: true
        push_token_registered:
          type: boolean
          description: 出于安全考虑不回显令牌本身，只告知是否已登记
        last_seen_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    SessionResponse:
      type: object
      additionalProperties: false
      required:
        - created
        - user
        - session
      properties:
        created:
          type: boolean
          description: Whether this call created the product account
        user:
          $ref: "#/components/schemas/User"
        session:
          $ref: "#/components/schemas/Session"
    User:
      type: object
      description: |
        账户主体，只放 **Privy 给不了的** 信息。

        邮箱、登录方式这些属于 Privy 的身份数据，客户端登录后已经拿在手里
        （`privyUser.linkedAccounts`），本接口不再重复返回一份 —— 两份数据
        同步不及时反而会不一致。设置页的「当前登录账户」直接读 SDK。

        用户偏好收在 `settings` 子对象里，更新走 `PATCH /v1/me/settings`。
      required:
        - user_id
        - settings
      properties:
        user_id:
          type: string
          format: uuid
        privy_did:
          type: string
          description: Privy 用户 DID
          example: did:privy:clxxxxxxxxxxxxxxxxxxx
        display_name:
          type: string
          nullable: true
        avatar_url:
          type: string
          format: uri
          nullable: true
        settings:
          $ref: "#/components/schemas/UserSettings"
        created_at:
          type: string
          format: date-time
    UserSettings:
      type: object
      description: 需要跨设备保留的用户偏好。随 `GET /v1/me` 返回，用 `PATCH /v1/me/settings` 更新。
      required:
        - language
        - push_enabled
        - notify_order_filled
        - notify_order_failed
        - notify_liquidation_warning
      properties:
        language:
          type: string
          enum:
            - zh-CN
            - en
          default: zh-CN
          description: |
            界面语言。服务端也用它决定推送通知的语言 —— 推送由后端发起，
            拿不到请求头里的 `Accept-Language`，所以这个偏好必须存在服务端。
        push_enabled:
          type: boolean
          default: true
          description: |
            推送总开关。关闭后后端不再向该用户的任何设备推送，
            下面三个分类开关的取值被忽略（但保留，重新打开总开关后恢复原样）。
        notify_order_filled:
          type: boolean
          default: true
          description: 订单成交。市价成交、限价单被撮合、止盈止损触发都归这一类。
        notify_order_failed:
          type: boolean
          default: true
          description: 订单失败。下单被拒、超出滑点、资金准备失败等。
        notify_liquidation_warning:
          type: boolean
          default: true
          description: |
            强平预警。仅对 HIP-3 合约仓位有效，现货持仓不会触发。
            触发阈值由平台统一设定，暂不支持用户自定义。
    UserSettingsUpdate:
      type: object
      additionalProperties: false
      description: |
        `PATCH /v1/me/settings` 的请求体。**所有字段可选，传什么改什么**；
        未出现的字段保持原值，不会被重置。
      properties:
        language:
          type: string
          enum:
            - zh-CN
            - en
        push_enabled:
          type: boolean
        notify_order_filled:
          type: boolean
        notify_order_failed:
          type: boolean
        notify_liquidation_warning:
          type: boolean
    KeyValue:
      type: object
      required:
        - label
        - value
      properties:
        label:
          type: string
          example: 授权额度
        value:
          type: string
          example: 500.00 USDC
        tone:
          type: string
          nullable: true
          enum:
            - default
            - positive
            - negative
            - muted
    ProductRef:
      type: object
      additionalProperties: false
      required:
