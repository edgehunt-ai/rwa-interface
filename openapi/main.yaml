components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Privy
      description: Privy access token issued to the signed-in client. The API does not issue a second access token.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Client-generated unique command key. A replay returns the first resource; a different request with the same key returns 409.
      schema:
        type: string
        format: uuid
      required: true
    Cursor:
      name: cursor
      in: query
      description: 上一页返回的 `next_cursor`
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    LastEventId:
      name: Last-Event-ID
      in: header
      description: |
        SSE 断线重连时传入最后成功处理的 `event_id`。服务端应从该事件之后补发；
        若保留窗口已过期，则发送一条 `resync_required` 事件并由客户端重新拉取快照。
      schema:
        type: string
    Symbol:
      name: symbol
      in: path
      required: true
      description: 股票代码
      schema:
        type: string
        example: NVDA
    ProductKind:
      name: kind
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ProductKind"
    OrderId:
      name: order_id
      in: path
      required: true
      schema:
        type: string
    PositionId:
      name: position_id
      in: path
      required: true
      schema:
        type: string
    DeviceId:
      name: device_id
      in: path
      required: true
      schema:
        type: string
    WalletId:
      name: wallet_id
      in: path
      required: true
      schema:
        type: string
    FundingPlanId:
      name: plan_id
      in: path
      required: true
      schema:
        type: string
    DepositId:
      name: deposit_id
      in: path
      required: true
      schema:
        type: string
    TransferId:
      name: transfer_id
      in: path
      required: true
      schema:
        type: string
    TransferActionId:
      name: action_id
      in: path
      required: true
      schema:
        type: string
    WithdrawalId:
      name: withdrawal_id
      in: path
      required: true
      schema:
        type: string
    ChallengeId:
      name: challenge_id
      in: path
      required: true
      schema:
        type: string
    StepId:
      name: step_id
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Resource not found
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: Idempotency, stale resource, or lifecycle conflict
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Missing, invalid, or expired Privy bearer token
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Authenticated user cannot perform this action
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    UnprocessableEntity:
      description: Business rule rejected the request
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ServiceUnavailable:
      description: A required service is unavailable
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    Decimal:
      type: string
      description: 十进制字符串，避免浮点误差
      pattern: ^-?[0-9]+(\.[0-9]+)?$
      example: "183.25"
    ApiError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - retryable
        - user_action
        - details
        - request_id
      properties:
        code:
          type: string
          description: Stable machine-readable error code
          example: insufficient_funds
        message:
          type: string
          description: Localized user-facing message
        retryable:
          type: boolean
          description: Whether retrying the same request can succeed
        user_action:
          type: string
          nullable: true
          description: Stable client action hint, or null
        details:
          type: object
          additionalProperties: true
          nullable: true
        request_id:
          type: string
          description: Matches the X-Request-ID response header
    Page:
      type: object
      required:
        - next_cursor
        - has_more
      properties:
        next_cursor:
          type: string
          nullable: true
          description: 为 `null` 表示没有更多数据
        has_more:
          type: boolean
    ProductKind:
      type: string
      description: |
        产品类型：
        * `bstock` —— BSC bStocks Token（现货）
        * `perp` —— HIP-3 Perpetual（永续合约）
      enum:
        - bstock
        - perp
      example: bstock
    ProductType:
      type: string
      description: 首页 / 市场页一级筛选
      enum:
        - all
        - spot
        - contract
      default: all
    MarketProductGroup:
      type: string
      description: |
        市场产品列表分组。`favorites` 仅表示当前登录用户的自选产品，其他值为全市场排行。
      enum:
        - hot
        - gainers
        - losers
        - volume
        - favorites
      default: hot
    Chain:
      type: string
      enum:
        - BSC
        - Arbitrum
        - Base
        - Ethereum
        - Hyperliquid
        - Polygon
        - Solana
    AccountKind:
      type: string
      description: |
        * `app` —— App 可用余额（聚合账户）
        * `bstocks` —— BSC Wallet，bStocks 交易账户
        * `hip3` —— HIP-3 交易账户
      enum:
        - app
        - bstocks
        - hip3
    OrderSide:
      type: string
      description: 现货用 `buy` / `sell`；合约用 `long` / `short`
      enum:
        - buy
        - sell
        - long
        - short
    OrderType:
      type: string
      enum:
        - market
        - limit
    MarginMode:
      type: string
      enum:
        - isolated
        - cross
    ChartRange:
      type: string
      enum:
        - 15m
        - 4h
        - 24h
        - 1w
      default: 24h
    SessionKind:
      type: string
      description: 美股交易时段：盘前 / 开盘 / 盘后 / 隔夜 / 周末休市 / 节假日休市
      enum:
        - premarket
        - regular
        - after
        - overnight
        - weekend
        - holiday
    PrivyClientConfig:
      type: object
      required:
        - privy_app_id
        - login_methods
      properties:
        privy_app_id:
          type: string
          example: clxxxxxxxxxxxxxxxxxxx
        privy_client_id:
          type: string
          nullable: true
          description: Privy 移动端 client ID（iOS / Android 分别配置时使用）
        login_methods:
          type: array
          items:
            type: string
            enum:
              - email
              - apple
              - google
        embedded_wallet:
          type: object
          description: Embedded Wallet 创建策略
          properties:
            create_on_login:
              type: string
              enum:
                - users-without-wallets
                - all-users
                - off
            chains:
              type: array
              items:
                $ref: "#/components/schemas/Chain"
        terms_url:
          type: string
          format: uri
        privacy_url:
          type: string
          format: uri
    SessionRequest:
      type: object
      additionalProperties: false
      properties:
        language:
          type: string
          nullable: true
          description: Preferred BCP 47 language tag. Existing users update their preference when supplied.
          example: zh-CN
        device:
          $ref: "#/components/schemas/DeviceInfo"
    Platform:
      type: string
      description: |
        客户端平台。当前为 `ios` / `android`，**后续可能新增**（如 `harmony`、`web`）。

        这里刻意用开放字符串而不是枚举：服务端新增平台时，老客户端反序列化
        不会因为遇到未知枚举值而崩溃。客户端只需认得自己那个值。
      example: ios
    DeviceInfo:
      type: object
      additionalProperties: false
      description: |
        登录时一并提交的设备信息，等价于调用一次 `POST /v1/me/devices`。
        令牌轮换必须走 `POST /v1/me/devices`。
      properties:
        device_id:
          type: string
          description: 客户端生成并持久化的设备标识，用于 upsert
        platform:
          $ref: "#/components/schemas/Platform"
        app_version:
          type: string
          example: 1.0.0
        push_token:
          type: string
          nullable: true
    DeviceRegisterRequest:
      type: object
      additionalProperties: false
      required:
        - device_id
        - platform
        - push_token
      properties:
        device_id:
          type: string
        platform:
          $ref: "#/components/schemas/Platform"
        app_version:
          type: string
          nullable: true
          example: 1.2.0
          description: |
            当前安装的版本号，可选。**用途是推送内容分流，不是设备统计**——
            比如老版本不支持富通知（图片 / 按钮）或某种深链格式时，
            后端据此回退成纯文本推送，避免老版本收到解析不了的 payload。

            与令牌一样会过期：客户端每次上报令牌时应一并带上当前版本号，
            不需要单独维护更新时机。
        push_token:
          type: string
          description: APNs / FCM 推送令牌
        push_provider:
          type: string
          enum:
            - apns
            - fcm
          description: 不传则由后端按 `platform` 推断
    Device:
      type: object
      required:
        - device_id
        - platform
      properties:
        device_id:
          type: string
        platform:
          $ref: "#/components/schemas/Platform"
        app_version:
          type: string
          nullable: true
          description: 用于推送内容分流；客户端未上报过时为 null
        push_provider:
          type: string
          enum:
            - apns
            - fcm
          nullable: true
        push_token_registered:
          type: boolean
          description: 出于安全考虑不回显令牌本身，只告知是否已登记
        last_seen_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    SessionResponse:
      type: object
      additionalProperties: false
      required:
        - created
        - user
        - session
      properties:
        created:
          type: boolean
          description: Whether this call created the product account
        user:
          $ref: "#/components/schemas/User"
        session:
          $ref: "#/components/schemas/Session"
    User:
      type: object
      description: |
        账户主体，只放 **Privy 给不了的** 信息。

        邮箱、登录方式这些属于 Privy 的身份数据，客户端登录后已经拿在手里
        （`privyUser.linkedAccounts`），本接口不再重复返回一份 —— 两份数据
        同步不及时反而会不一致。设置页的「当前登录账户」直接读 SDK。

        用户偏好收在 `settings` 子对象里，更新走 `PATCH /v1/me/settings`。
      required:
        - user_id
        - settings
      properties:
        user_id:
          type: string
          format: uuid
        privy_did:
          type: string
          description: Privy 用户 DID
          example: did:privy:clxxxxxxxxxxxxxxxxxxx
        display_name:
          type: string
          nullable: true
        avatar_url:
          type: string
          format: uri
          nullable: true
        settings:
          $ref: "#/components/schemas/UserSettings"
        created_at:
          type: string
          format: date-time
    UserSettings:
      type: object
      description: 需要跨设备保留的用户偏好。随 `GET /v1/me` 返回，用 `PATCH /v1/me/settings` 更新。
      required:
        - language
        - push_enabled
        - notify_order_filled
        - notify_order_failed
        - notify_liquidation_warning
      properties:
        language:
          type: string
          enum:
            - zh-CN
            - en
          default: zh-CN
          description: |
            界面语言。服务端也用它决定推送通知的语言 —— 推送由后端发起，
            拿不到请求头里的 `Accept-Language`，所以这个偏好必须存在服务端。
        push_enabled:
          type: boolean
          default: true
          description: |
            推送总开关。关闭后后端不再向该用户的任何设备推送，
            下面三个分类开关的取值被忽略（但保留，重新打开总开关后恢复原样）。
        notify_order_filled:
          type: boolean
          default: true
          description: 订单成交。市价成交、限价单被撮合、止盈止损触发都归这一类。
        notify_order_failed:
          type: boolean
          default: true
          description: 订单失败。下单被拒、超出滑点、资金准备失败等。
        notify_liquidation_warning:
          type: boolean
          default: true
          description: |
            强平预警。仅对 HIP-3 合约仓位有效，现货持仓不会触发。
            触发阈值由平台统一设定，暂不支持用户自定义。
    UserSettingsUpdate:
      type: object
      additionalProperties: false
      description: |
        `PATCH /v1/me/settings` 的请求体。**所有字段可选，传什么改什么**；
        未出现的字段保持原值，不会被重置。
      properties:
        language:
          type: string
          enum:
            - zh-CN
            - en
        push_enabled:
          type: boolean
        notify_order_filled:
          type: boolean
        notify_order_failed:
          type: boolean
        notify_liquidation_warning:
          type: boolean
    KeyValue:
      type: object
      required:
        - label
        - value
      properties:
        label:
          type: string
          example: 授权额度
        value:
          type: string
          example: 500.00 USDC
        tone:
          type: string
          nullable: true
          enum:
            - default
            - positive
            - negative
            - muted
    ProductRef:
      type: object
      additionalProperties: false
      required:
        - symbol
        - kind
      properties:
        symbol:
          type: string
          example: NVDA
        kind:
          $ref: "#/components/schemas/ProductKind"
    Stock:
      type: object
      required:
        - symbol
        - name
        - reference_price
      properties:
        symbol:
          type: string
          example: NVDA
        name:
          type: string
          example: NVIDIA
        logo_url:
          type: string
          format: uri
          nullable: true
        logo_text:
          type: string
          description: 无图时的占位字母
          example: NV
        reference_price:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          description: 美股最近参考价
        reference_session:
          $ref: "#/components/schemas/SessionKind"
        reference_at:
          type: string
          format: date-time
    StockGroup:
      type: object
      description: 市场页「股票」Tab 的一张卡片
      required:
        - stock
        - products
      properties:
        stock:
          $ref: "#/components/schemas/Stock"
        products:
          type: array
          items:
            $ref: "#/components/schemas/ProductListing"
    ProductListing:
      type: object
      description: 榜单 / 分组中的单个产品行
      required:
        - symbol
        - kind
        - price
      properties:
        symbol:
          type: string
          example: NVDA
        name:
          type: string
          example: NVIDIA
        kind:
          $ref: "#/components/schemas/ProductKind"
        product_type:
          type: string
          enum:
            - spot
            - contract
        label:
          type: string
          description: 展示名，`bStocks` 或 `HIP-3`
          example: bStocks
        price:
          $ref: "#/components/schemas/Decimal"
        change_24h_percent:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          description: 24h 涨跌幅（百分比数值，如 `"0.47"`）
        spread_vs_reference_percent:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          description: 相对美股参考价的价差百分比
        volume_24h:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          description: 24h 成交量（以基础资产计价）
        volume_24h_unit:
          type: string
          example: NVDAB
        turnover_24h_usd:
          $ref: "#/components/schemas/Decimal"
        hot_rank:
          type: integer
          nullable: true
        is_favorite:
          type: boolean
          default: false
    ProductDetail:
      type: object
      required:
        - symbol
        - kind
        - quote
        - asset_info
      properties:
        symbol:
          type: string
        name:
          type: string
        kind:
          $ref: "#/components/schemas/ProductKind"
        title:
          type: string
          description: 产品标题，如 `BSC bStocks Token` / `HIP-3 Perpetual`
        badge:
          type: string
          description: 角标，如 `Spot · BSC` / `Isolated margin`
        description:
          type: string
          description: 产品说明长文案
        quote:
          $ref: "#/components/schemas/Quote"
        stats:
          $ref: "#/components/schemas/MarketStats"
        asset_info:
          $ref: "#/components/schemas/AssetInfo"
        trading_hours:
          type: string
          description: 交易时间说明
          enum:
            - 24x7
            - us_market_hours
          default: 24x7
    Quote:
      type: object
      required:
        - price
      properties:
        label:
          type: string
          description: 报价说明，如 `Last traded · NVDAB/USDC` 或 `Mark price · NVDA-PERP`
        price:
          $ref: "#/components/schemas/Decimal"
        change_24h:
          $ref: "#/components/schemas/Decimal"
        change_24h_percent:
          $ref: "#/components/schemas/Decimal"
        updated_at:
          type: string
          format: date-time
    MarketStats:
      type: object
      properties:
        high_24h:
          $ref: "#/components/schemas/Decimal"
        low_24h:
          $ref: "#/components/schemas/Decimal"
        turnover_24h_usd:
          $ref: "#/components/schemas/Decimal"
        volume_24h:
          $ref: "#/components/schemas/Decimal"
        volume_24h_unit:
          type: string
          example: NVDAB
        reference_label:
          type: string
          description: bStocks 为 `US Stock Reference`；HIP-3 为 `Spot / Reference Price`
        reference_price:
          $ref: "#/components/schemas/Decimal"
        relative_label:
          type: string
          description: bStocks 为 `Premium`；HIP-3 为 `Basis`
        relative_percent:
          $ref: "#/components/schemas/Decimal"
        spread_percent:
          $ref: "#/components/schemas/Decimal"
        best_bid:
          $ref: "#/components/schemas/Decimal"
        best_ask:
          $ref: "#/components/schemas/Decimal"
        funding_rate:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          type: string
          nullable: true
          description: 仅 HIP-3。正费率多头付空头，负费率反向。
        next_funding_at:
          type: string
          format: date-time
          nullable: true
        open_interest_usd:
          type: string
          nullable: true
          description: 仅 HIP-3
    OrderBook:
      type: object
      required:
        - bids
        - asks
      properties:
        bids:
          type: array
          items:
            $ref: "#/components/schemas/OrderBookLevel"
        asks:
          type: array
          items:
            $ref: "#/components/schemas/OrderBookLevel"
        updated_at:
          type: string
          format: date-time
    OrderBookLevel:
      type: object
      required:
        - price
        - size
      properties:
        price:
          $ref: "#/components/schemas/Decimal"
        size:
          $ref: "#/components/schemas/Decimal"
    AssetInfo:
      type: object
      description: 资产详情与权益
      required:
        - title
        - badge
        - description
        - rows
      properties:
        title:
          type: string
          example: BSC bStocks Token
        badge:
          type: string
          example: Spot · BSC
        description:
          type: string
          example: 获得 NVIDIA 底层证券的经济敞口；持有的是 BSC 钱包内的链上证券代币，不是 NVIDIA 股份的直接所有权。
        rows:
          type: array
          description: |
            权益明细。bStocks 典型项：发行方 / 资产支持 / 公司行动 / 股息再投资 /
            股息形式 / 投票权 / 资产结果。HIP-3 典型项：产品形态 / 底层权益 /
            保证金模式 / 股息再投资 / 资金费率 / 费率方向 / 资产结果。
          items:
            $ref: "#/components/schemas/KeyValue"
    CandleSeries:
      type: object
      required:
        - symbol
        - kind
        - range
        - points
      properties:
        symbol:
          type: string
        kind:
          $ref: "#/components/schemas/ProductKind"
        range:
          $ref: "#/components/schemas/ChartRange"
        interval:
          type: string
          example: 5m
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        change_absolute:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          description: 区间涨跌额，用于图表标题 `+$4.12 (+2.31%) 24h`
        change_percent:
          $ref: "#/components/schemas/Decimal"
        points:
          type: array
          description: 链上产品价格序列
          items:
            $ref: "#/components/schemas/CandlePoint"
        reference_points:
          type: array
          description: |
            美股参考价序列。仅在美股有报价的时段有值 —— 隔夜与休市时段为空洞，
            前端应断开连线或画虚线。
          items:
            $ref: "#/components/schemas/CandlePoint"
        sessions:
          type: array
          description: 该区间内的时段分段，用于绘制底部色带
          items:
            $ref: "#/components/schemas/SessionSegment"
    CandlePoint:
      type: object
      required:
        - t
        - c
      properties:
        t:
          type: string
          format: date-time
          description: 该点时间
        o:
          $ref: "#/components/schemas/Decimal"
        h:
          $ref: "#/components/schemas/Decimal"
        l:
          $ref: "#/components/schemas/Decimal"
        c:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          description: 收盘 / 该点价格
        v:
          $ref: "#/components/schemas/Decimal"
    SessionSegment:
      type: object
      required:
        - session
        - start
        - end
      properties:
        session:
          $ref: "#/components/schemas/SessionKind"
        label:
          type: string
          example: 开盘
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
    MarketSessionInfo:
      type: object
      required:
        - current
        - timezone
      properties:
        timezone:
          type: string
          example: America/New_York
        current:
          $ref: "#/components/schemas/SessionKind"
        current_label:
          type: string
          example: 开盘
        current_description:
          type: string
          example: 传统美股主要交易时段，价格发现和成交最活跃。
        next_session:
          $ref: "#/components/schemas/SessionKind"
        next_transition_at:
          type: string
          format: date-time
        seconds_until_transition:
          type: integer
          description: 距下一次时段切换的秒数，用于「距开盘 02:14:33」倒计时
        is_holiday:
          type: boolean
        holiday_name:
          type: string
          nullable: true
        segments:
          type: array
          items:
            $ref: "#/components/schemas/SessionSegment"
    ReferencePrice:
      type: object
      required:
        - symbol
        - price
        - session
        - as_of
      properties:
        symbol:
          type: string
        price:
          $ref: "#/components/schemas/Decimal"
        session:
          $ref: "#/components/schemas/SessionKind"
        as_of:
          type: string
          format: date-time
        is_stale:
          type: boolean
          description: 休市 / 隔夜时段为 `true`，前端应提示参考价停留在最近收盘水平
    OrderStatus:
      type: string
      description: 订单包含可恢复的 ambiguous 和需人工介入的 manual_review 状态；客户端通过订单 GET 与 SSE 跟踪后续变化。
      enum:
        - pending_signature
