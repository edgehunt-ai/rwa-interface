// privy_flutter 0.10.2 initializes the SDK with an Application context, which
// cannot launch Credential Manager UI. Patch a build-local source copy, never
// the shared Pub cache. Fail on upstream changes so upgrades require review.
def upstream = file("src/main/kotlin")
def patched = layout.buildDirectory.dir("activity-context/kotlin")
def compat = rootProject.file("privy-compat/src/main/kotlin")

def prepare = tasks.register("preparePrivyActivityContext") {
    inputs.dir(upstream)
    outputs.dir(patched)
    doLast {
        def replacements = [
            "io/privy/privyflutter/PrivyManager.kt": [
                "context = context.applicationContext,": "context = PrivyActivityContext.get(context),",
            ],
            "io/privy/privyflutter/PrivyPlugin.kt": [
                "class PrivyPlugin : FlutterPlugin {": """class PrivyPlugin : FlutterPlugin, io.flutter.embedding.engine.plugins.activity.ActivityAware {
    private lateinit var activityContext: PrivyActivityContext

    override fun onAttachedToActivity(binding: io.flutter.embedding.engine.plugins.activity.ActivityPluginBinding) {
        activityContext.attach(binding.activity)
    }

    override fun onDetachedFromActivityForConfigChanges() { activityContext.detach() }

    override fun onReattachedToActivityForConfigChanges(binding: io.flutter.embedding.engine.plugins.activity.ActivityPluginBinding) {
        onAttachedToActivity(binding)
    }

    override fun onDetachedFromActivity() { activityContext.detach() }
""",
                "coroutineScope = CoroutineScope(SupervisorJob() + Dispatchers.IO)": """activityContext = PrivyActivityContext.get(binding.applicationContext)
        coroutineScope = CoroutineScope(SupervisorJob() + Dispatchers.IO)""",
                "InitializationHandler(binding.applicationContext,": "InitializationHandler(activityContext,",
                "methodChannel.setMethodCallHandler(null)": """activityContext.detach()
        methodChannel.setMethodCallHandler(null)""",
            ],
        ]
        project.sync { from(upstream); into(patched) }
        replacements.each { path, changes ->
            def source = new File(patched.get().asFile, path)
            def text = source.getText("UTF-8")
            changes.each { before, after ->
                if (text.count(before) != 1) {
                    throw new GradleException("Review Privy Activity context compatibility patch: ${path}")
                }
                text = text.replace(before, after)
            }
            source.setText(text, "UTF-8")
        }
    }
}

android.sourceSets.main.java.setSrcDirs([patched, compat])
kotlin.sourceSets.main.kotlin.setSrcDirs([patched, compat])
tasks.named("preBuild").configure { dependsOn(prepare) }
tasks.matching { it.name.startsWith("compile") && it.name.endsWith("Kotlin") }
    .configureEach { dependsOn(prepare) }
